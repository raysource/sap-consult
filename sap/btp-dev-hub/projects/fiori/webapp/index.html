<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>培训产品目录 - SAPUI5 演示</title>
  <!--
    本地预览(需联网加载 OpenUI5):
      cd btp-dev-hub/projects/fiori/webapp
      python3 -m http.server 8080
      浏览器打开 http://localhost:8080/index.html
  -->
  <script id="sap-ui-bootstrap"
          src="https://sapui5.hana.ondemand.com/resources/sap-ui-core.js"
          data-sap-ui-theme="sap_horizon"
          data-sap-ui-resourceroots='{"com.training.products": "./"}'
          data-sap-ui-oninit="module:sap/ui/core/ComponentSupport"
          data-sap-ui-compatVersion="edge"
          data-sap-ui-async="true"
          data-sap-ui-frameOptions="trusted">
  </script>
</head>
<body class="sapUiBody sapUiSizeCompact" id="content">
  <!-- UIComponent 挂载点 -->
  <div data-sap-ui-component
       data-name="com.training.products"
       data-id="trainingProductsApp"
       data-settings='{"id": "trainingProductsApp"}'
       style="height:100%">
  </div>
</body>
</html>
