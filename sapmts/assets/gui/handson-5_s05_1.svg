<text x="62" y="159" font-size="12" font-weight="700" font-family='-apple-system,BlinkMacSystemFont,"Noto Sans CJK JP","Hiragino Sans","Microsoft YaHei",Meiryo,sans-serif' fill="#17263a" text-anchor="start">構造</text>
<line x1="56" y1="142" x2="56" y2="722" stroke="#c3ccd6" stroke-width="1"/>
<text x="337.5" y="159" font-size="12" font-weight="700" font-family='-apple-system,BlinkMacSystemFont,"Noto Sans CJK JP","Hiragino Sans","Microsoft YaHei",Meiryo,sans-serif' fill="#17263a" text-anchor="start">MTS（見込生産）</text>
<line x1="331.5" y1="142" x2="331.5" y2="722" stroke="#c3ccd6" stroke-width="1"/>
<text x="773.7083333333333" y="159" font-size="12" font-weight="700" font-family='-apple-system,BlinkMacSystemFont,"Noto Sans CJK JP","Hiragino Sans","Microsoft YaHei",Meiryo,sans-serif' fill="#17263a" text-anchor="start">MTO（受注生産）</text>
<line x1="767.7083333333333" y1="142" x2="767.7083333333333" y2="722" stroke="#c3ccd6" stroke-width="1"/>
<rect x="22" y="166" width="1136" height="26" rx="0" fill="#fff3a6" stroke="#d7dee6" stroke-width="1"/>
<text x="39" y="183.68" font-size="11.5" font-family='SFMono-Regular,Menlo,Consolas,"Courier New",monospace' fill="#6b7a8d" text-anchor="middle">1</text>
<text x="62" y="183.68" font-size="12" font-family='SFMono-Regular,Menlo,Consolas,"Courier New",monospace' fill="#5c4b00" text-anchor="start">库存の所有者</text>
<text x="337.5" y="183.68" font-size="12" font-family='SFMono-Regular,Menlo,Consolas,"Courier New",monospace' fill="#5c4b00" text-anchor="start">全社（自由在庫・MARD）</text>
<text x="773.7083333333333" y="183.68" font-size="12" font-family='SFMono-Regular,Menlo,Consolas,"Courier New",monospace' fill="#5c4b00" text-anchor="start">その受注だけ（受注在庫 E・MSKA）</text>
<rect x="22" y="192" width="1136" height="26" rx="0" fill="#f3f6fa" stroke="#d7dee6" stroke-width="1"/>
<text x="39" y="209.68" font-size="11.5" font-family='SFMono-Regular,Menlo,Consolas,"Courier New",monospace' fill="#6b7a8d" text-anchor="middle">2</text>
<text x="62" y="209.68" font-size="12" font-family='SFMono-Regular,Menlo,Consolas,"Courier New",monospace' fill="#101820" text-anchor="start">誰が先に取れるか</text>
<text x="337.5" y="209.68" font-size="12" font-family='SFMono-Regular,Menlo,Consolas,"Courier New",monospace' fill="#101820" text-anchor="start">登録順・納期順（ATP）</text>
<text x="773.7083333333333" y="209.68" font-size="12" font-family='SFMono-Regular,Menlo,Consolas,"Courier New",monospace' fill="#101820" text-anchor="start">取り合いにならない（在庫が別）</text>
<rect x="22" y="218" width="1136" height="26" rx="0" fill="#ffffff" stroke="#d7dee6" stroke-width="1"/>
<text x="39" y="235.68" font-size="11.5" font-family='SFMono-Regular,Menlo,Consolas,"Courier New",monospace' fill="#6b7a8d" text-anchor="middle">3</text>
<text x="62" y="235.68" font-size="12" font-family='SFMono-Regular,Menlo,Consolas,"Courier New",monospace' fill="#101820" text-anchor="start">余ったときのコスト</text>
<text x="337.5" y="235.68" font-size="12" font-family='SFMono-Regular,Menlo,Consolas,"Courier New",monospace' fill="#101820" text-anchor="start">在庫維持費・評価減（見込在庫のリスク）</text>
<text x="773.7083333333333" y="235.68" font-size="12" font-family='SFMono-Regular,Menlo,Consolas,"Courier New",monospace' fill="#101820" text-anchor="start">受注取消なら残るが、その受注専用</text>
<rect x="22" y="244" width="1136" height="26" rx="0" fill="#f3f6fa" stroke="#d7dee6" stroke-width="1"/>
<text x="39" y="261.68" font-size="11.5" font-family='SFMono-Regular,Menlo,Consolas,"Courier New",monospace' fill="#6b7a8d" text-anchor="middle">4</text>
<text x="62" y="261.68" font-size="12" font-family='SFMono-Regular,Menlo,Consolas,"Courier New",monospace' fill="#101820" text-anchor="start">欠品したときの打ち手</text>
<text x="337.5" y="261.68" font-size="12" font-family='SFMono-Regular,Menlo,Consolas,"Courier New",monospace' fill="#101820" text-anchor="start">引当付け替え・納期調整・追加入庫（5-4）</text>
<text x="773.7083333333333" y="261.68" font-size="12" font-family='SFMono-Regular,Menlo,Consolas,"Courier New",monospace' fill="#101820" text-anchor="start">生産を前倒し・納期を延ばす</text>
<rect x="22" y="270" width="1136" height="26" rx="0" fill="#ffffff" stroke="#d7dee6" stroke-width="1"/>
<text x="39" y="287.68" font-size="11.5" font-family='SFMono-Regular,Menlo,Consolas,"Courier New",monospace' fill="#6b7a8d" text-anchor="middle">5</text>
<text x="62" y="287.68" font-size="12" font-family='SFMono-Regular,Menlo,Consolas,"Courier New",monospace' fill="#101820" text-anchor="start">計画パラメータの意味</text>
<text x="337.5" y="287.68" font-size="12" font-family='SFMono-Regular,Menlo,Consolas,"Courier New",monospace' fill="#101820" text-anchor="start">安全在庫＝欠品率の調整つまみ、ロットサイズ＝段取りと在庫のトレードオフ</text>
<text x="773.7083333333333" y="287.68" font-size="12" font-family='SFMono-Regular,Menlo,Consolas,"Courier New",monospace' fill="#101820" text-anchor="start">リードタイム＝納期約束の限界</text>
<text x="22" y="314" font-size="11.5" font-family='-apple-system,BlinkMacSystemFont,"Noto Sans CJK JP","Hiragino Sans","Microsoft YaHei",Meiryo,sans-serif' fill="#6b7a8d" text-anchor="start" font-style="italic">MTS の在庫は「誰のものでもない」＝ 速く売れるが、余れば自分の責任になる。ここが計画パラメータの意味につながる。</text>
