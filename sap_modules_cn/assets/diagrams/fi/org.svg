<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 470" width="1280" height="470" role="img" aria-label="FI 组织结构与分配关系" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif">
<title>FI 组织结构与分配关系</title>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0a6ed1"/></marker><marker id="ar2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#007272"/></marker><marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ffffff"/></marker><marker id="arback" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M10,0 L0,5 L10,10 z" fill="#b3261e"/></marker></defs>
<rect width="1280" height="470" fill="#ffffff"/>
<text x="40.0" y="46.0" font-size="22" fill="#1d2d3e" text-anchor="start" font-weight="700">FI 组织结构与分配关系</text>
<text x="40.0" y="72.0" font-size="12.5" fill="#6b7a8d" text-anchor="start" font-weight="400">教材场景：公司代码 C999 / 科目表 A999 / 会计年度变式 ZF / 信贷控制范围 C999 / 记账期间变式 P999 / 字段状态变式 Z001</text>
<rect x="515.0" y="108.0" width="250.0" height="56.0" rx="9" fill="#e3f0fa" stroke="#0a6ed1" stroke-width="1.4"/>
<text x="526.0" y="129.0" font-size="13.5" fill="#0a6ed1" text-anchor="start" font-weight="700">公司代码 C999（颐宁机械有限公司）</text>
<text x="526.0" y="146.0" font-size="11.5" fill="#354a5f" text-anchor="start" font-weight="400">对外出报表的最小法人单位（任务 01）</text>
<rect x="40.0" y="226.0" width="250.0" height="56.0" rx="9" fill="#e6f2f2" stroke="#007272" stroke-width="1.4"/>
<text x="51.0" y="247.0" font-size="13.5" fill="#007272" text-anchor="start" font-weight="700">会计科目表 A999</text>
<text x="51.0" y="264.0" font-size="11.5" fill="#354a5f" text-anchor="start" font-weight="400">科目号长度 8 位（任务 02）</text>
<rect x="356.7" y="226.0" width="250.0" height="72.0" rx="9" fill="#e6f2f2" stroke="#007272" stroke-width="1.4"/>
<text x="367.7" y="247.0" font-size="13.5" fill="#007272" text-anchor="start" font-weight="700">会计年度变式 ZF</text>
<text x="367.7" y="264.0" font-size="11.5" fill="#354a5f" text-anchor="start" font-weight="400">12 个正常期间 + 13–16 特殊期间（任务</text>
<text x="367.7" y="280.0" font-size="11.5" fill="#354a5f" text-anchor="start" font-weight="400">03）</text>
<rect x="673.3" y="226.0" width="250.0" height="56.0" rx="9" fill="#e6f2f2" stroke="#007272" stroke-width="1.4"/>
<text x="684.3" y="247.0" font-size="13.5" fill="#007272" text-anchor="start" font-weight="700">信贷控制范围 C999</text>
<text x="684.3" y="264.0" font-size="11.5" fill="#354a5f" text-anchor="start" font-weight="400">与公司代码多对一（任务 04）</text>
<rect x="990.0" y="226.0" width="250.0" height="56.0" rx="9" fill="#efeaf9" stroke="#5b3fa8" stroke-width="1.4"/>
<text x="1001.0" y="247.0" font-size="13.5" fill="#5b3fa8" text-anchor="start" font-weight="700">记账期间变式 P999</text>
<text x="1001.0" y="264.0" font-size="11.5" fill="#354a5f" text-anchor="start" font-weight="400">控制哪些期间可过账（任务 16/17）</text>
<rect x="40.0" y="344.0" width="227.2" height="56.0" rx="9" fill="#e6f2ec" stroke="#177245" stroke-width="1.4"/>
<text x="51.0" y="365.0" font-size="13.5" fill="#177245" text-anchor="start" font-weight="700">科目组 RAA / BSA / PLA</text>
<text x="51.0" y="382.0" font-size="11.5" fill="#354a5f" text-anchor="start" font-weight="400">控制科目本身的字段与编号</text>
<rect x="283.2" y="344.0" width="227.2" height="56.0" rx="9" fill="#e6f2ec" stroke="#177245" stroke-width="1.4"/>
<text x="294.2" y="365.0" font-size="13.5" fill="#177245" text-anchor="start" font-weight="700">字段状态变式 Z001</text>
<text x="294.2" y="382.0" font-size="11.5" fill="#354a5f" text-anchor="start" font-weight="400">分配给公司代码 C999（任务 07/08）</text>
<rect x="526.4" y="344.0" width="227.2" height="88.0" rx="9" fill="#e6f2ec" stroke="#177245" stroke-width="1.4"/>
<text x="537.4" y="365.0" font-size="13.5" fill="#177245" text-anchor="start" font-weight="700">字段状态组（5 个）</text>
<text x="537.4" y="382.0" font-size="11.5" fill="#354a5f" text-anchor="start" font-weight="400">ZEXP 费用 · ZGBS 一般资产负债</text>
<text x="537.4" y="398.0" font-size="11.5" fill="#354a5f" text-anchor="start" font-weight="400">ZMMA 材料采购 · ZRAA 统驭 · ZREV</text>
<text x="537.4" y="414.0" font-size="11.5" fill="#354a5f" text-anchor="start" font-weight="400">收入</text>
<rect x="769.6" y="344.0" width="227.2" height="72.0" rx="9" fill="#fdf3d7" stroke="#8d6e00" stroke-width="1.4"/>
<text x="780.6" y="365.0" font-size="13.5" fill="#8d6e00" text-anchor="start" font-weight="700">客户账户组与编号范围</text>
<text x="780.6" y="382.0" font-size="11.5" fill="#354a5f" text-anchor="start" font-weight="400">K001 订货方 / K002 收货方</text>
<text x="780.6" y="398.0" font-size="11.5" fill="#354a5f" text-anchor="start" font-weight="400">Z1 10000000–19999999</text>
<rect x="1012.8" y="344.0" width="227.2" height="104.0" rx="9" fill="#fdf3d7" stroke="#8d6e00" stroke-width="1.4"/>
<text x="1023.8" y="365.0" font-size="13.5" fill="#8d6e00" text-anchor="start" font-weight="700">供应商账户组与编号范围</text>
<text x="1023.8" y="382.0" font-size="11.5" fill="#354a5f" text-anchor="start" font-weight="400">G001 原材料 / G002 贸易商品 / G003</text>
<text x="1023.8" y="398.0" font-size="11.5" fill="#354a5f" text-anchor="start" font-weight="400">费用</text>
<text x="1023.8" y="414.0" font-size="11.5" fill="#354a5f" text-anchor="start" font-weight="400">Z2 20000000–29999999 · Z3</text>
<text x="1023.8" y="430.0" font-size="11.5" fill="#354a5f" text-anchor="start" font-weight="400">30000000–39999999</text>
