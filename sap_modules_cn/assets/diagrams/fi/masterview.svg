<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 712" width="1280" height="712" role="img" aria-label="主数据分层：总账科目两层、客户与供应商三层" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif">
<title>主数据分层：总账科目两层、客户与供应商三层</title>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0a6ed1"/></marker><marker id="ar2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#007272"/></marker><marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ffffff"/></marker><marker id="arback" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M10,0 L0,5 L10,10 z" fill="#b3261e"/></marker></defs>
<rect width="1280" height="712" fill="#ffffff"/>
<text x="40.0" y="46.0" font-size="22" fill="#1d2d3e" text-anchor="start" font-weight="700">主数据分层：总账科目两层、客户与供应商三层</text>
<text x="40.0" y="72.0" font-size="12.5" fill="#6b7a8d" text-anchor="start" font-weight="400">同一个对象按组织层存在不同表里；科目过不了账、客户带不出统驭科目，都是层没维护全</text>
<rect x="40.0" y="104.0" width="1200.0" height="134.0" rx="12" fill="#e3f0fa" stroke="#0a6ed1" stroke-width="1.2"/>
<text x="58.0" y="132.0" font-size="15.5" fill="#0a6ed1" text-anchor="start" font-weight="700">① 总账科目 · 科目表层（跨公司代码）· 表 SKA1</text>
<text x="409.2" y="132.0" font-size="12" fill="#6b7a8d" text-anchor="start" font-weight="400">科目组在这里（与公司代码无关）</text>
<rect x="58.0" y="150.0" width="280.5" height="76.0" rx="8" fill="#ffffff" stroke="#0a6ed1" stroke-width="1.2"/>
<text x="70.0" y="171.0" font-size="13.5" fill="#0a6ed1" text-anchor="start" font-weight="700">科目号与描述</text>
<text x="70.0" y="188.0" font-size="11.5" fill="#354a5f" text-anchor="start" font-weight="400">教材 8 位，如 10020101 银行存款</text>
<text x="70.0" y="205.0" font-size="11.5" fill="#354a5f" text-anchor="start" font-weight="400">画面常见 0010020111（前导零）</text>
<rect x="352.5" y="150.0" width="280.5" height="76.0" rx="8" fill="#ffffff" stroke="#0a6ed1" stroke-width="1.2"/>
<text x="364.5" y="171.0" font-size="13.5" fill="#0a6ed1" text-anchor="start" font-weight="700">科目组</text>
<text x="364.5" y="188.0" font-size="11.5" fill="#354a5f" text-anchor="start" font-weight="400">RAA 统驭 · BSA 资产负债 · PLA 损益</text>
<rect x="647.0" y="150.0" width="280.5" height="76.0" rx="8" fill="#ffffff" stroke="#0a6ed1" stroke-width="1.2"/>
<text x="659.0" y="171.0" font-size="13.5" fill="#0a6ed1" text-anchor="start" font-weight="700">会计科目表</text>
<text x="659.0" y="188.0" font-size="11.5" fill="#354a5f" text-anchor="start" font-weight="400">A999（任务 02 建）</text>
<rect x="941.5" y="150.0" width="280.5" height="76.0" rx="8" fill="#ffffff" stroke="#0a6ed1" stroke-width="1.2"/>
<text x="953.5" y="171.0" font-size="13.5" fill="#0a6ed1" text-anchor="start" font-weight="700">编号范围</text>
<text x="953.5" y="188.0" font-size="11.5" fill="#354a5f" text-anchor="start" font-weight="400">科目号是内部给号还是外部给号</text>
<rect x="40.0" y="254.0" width="1200.0" height="134.0" rx="12" fill="#e6f2f2" stroke="#007272" stroke-width="1.2"/>
<text x="58.0" y="282.0" font-size="15.5" fill="#007272" text-anchor="start" font-weight="700">② 总账科目 · 公司代码层 · 表 SKB1</text>
<text x="321.1" y="282.0" font-size="12" fill="#6b7a8d" text-anchor="start" font-weight="400">凭证能不能记、记成什么样，都在这一层</text>
<rect x="58.0" y="300.0" width="280.5" height="76.0" rx="8" fill="#ffffff" stroke="#007272" stroke-width="1.2"/>
<text x="70.0" y="321.0" font-size="13.5" fill="#007272" text-anchor="start" font-weight="700">字段状态组</text>
<text x="70.0" y="338.0" font-size="11.5" fill="#354a5f" text-anchor="start" font-weight="400">ZGBS / ZRAA / ZREV</text>
<text x="70.0" y="355.0" font-size="11.5" fill="#354a5f" text-anchor="start" font-weight="400">ZMMA / ZEXP</text>
<rect x="352.5" y="300.0" width="280.5" height="76.0" rx="8" fill="#ffffff" stroke="#007272" stroke-width="1.2"/>
<text x="364.5" y="321.0" font-size="13.5" fill="#007272" text-anchor="start" font-weight="700">统驭科目与排序码</text>
<text x="364.5" y="338.0" font-size="11.5" fill="#354a5f" text-anchor="start" font-weight="400">客户 11310101 · 供应商 21210101</text>
<text x="364.5" y="355.0" font-size="11.5" fill="#354a5f" text-anchor="start" font-weight="400">任务 29 排序码 001</text>
<rect x="647.0" y="300.0" width="280.5" height="76.0" rx="8" fill="#ffffff" stroke="#007272" stroke-width="1.2"/>
<text x="659.0" y="321.0" font-size="13.5" fill="#007272" text-anchor="start" font-weight="700">只能自动记帐</text>
<text x="659.0" y="338.0" font-size="11.5" fill="#354a5f" text-anchor="start" font-weight="400">任务 43 给收入 51010101 打勾</text>
<rect x="941.5" y="300.0" width="280.5" height="76.0" rx="8" fill="#ffffff" stroke="#007272" stroke-width="1.2"/>
<text x="953.5" y="321.0" font-size="13.5" fill="#007272" text-anchor="start" font-weight="700">货币与税务类型</text>
<text x="953.5" y="338.0" font-size="11.5" fill="#354a5f" text-anchor="start" font-weight="400">RMB；未交税金 21710101/21710102</text>
<rect x="40.0" y="404.0" width="1200.0" height="134.0" rx="12" fill="#e6f2ec" stroke="#177245" stroke-width="1.2"/>
<text x="58.0" y="432.0" font-size="15.5" fill="#177245" text-anchor="start" font-weight="700">③ 客户主数据 · KNA1 / KNB1 / KNVV</text>
<text x="328.8" y="432.0" font-size="12" fill="#6b7a8d" text-anchor="start" font-weight="400">FI 维护前两层，SD 维护销售层</text>
<rect x="58.0" y="450.0" width="280.5" height="76.0" rx="8" fill="#ffffff" stroke="#177245" stroke-width="1.2"/>
<text x="70.0" y="471.0" font-size="13.5" fill="#177245" text-anchor="start" font-weight="700">一般数据（KNA1）</text>
<text x="70.0" y="488.0" font-size="11.5" fill="#354a5f" text-anchor="start" font-weight="400">名称、地址、税号、银行</text>
<rect x="352.5" y="450.0" width="280.5" height="76.0" rx="8" fill="#ffffff" stroke="#177245" stroke-width="1.2"/>
<text x="364.5" y="471.0" font-size="13.5" fill="#177245" text-anchor="start" font-weight="700">公司代码数据（KNB1）</text>
<text x="364.5" y="488.0" font-size="11.5" fill="#354a5f" text-anchor="start" font-weight="400">统驭科目 11310101、排序码、</text>
<text x="364.5" y="505.0" font-size="11.5" fill="#354a5f" text-anchor="start" font-weight="400">付款条件、容差组</text>
<rect x="647.0" y="450.0" width="280.5" height="76.0" rx="8" fill="#ffffff" stroke="#177245" stroke-width="1.2"/>
<text x="659.0" y="471.0" font-size="13.5" fill="#177245" text-anchor="start" font-weight="700">销售数据（KNVV）</text>
<text x="659.0" y="488.0" font-size="11.5" fill="#354a5f" text-anchor="start" font-weight="400">销售范围层（SD 维护，教材未演示）</text>
<rect x="941.5" y="450.0" width="280.5" height="76.0" rx="8" fill="#ffffff" stroke="#177245" stroke-width="1.2"/>
<text x="953.5" y="471.0" font-size="13.5" fill="#177245" text-anchor="start" font-weight="700">账户组与编号范围</text>
<text x="953.5" y="488.0" font-size="11.5" fill="#354a5f" text-anchor="start" font-weight="400">K001 订货方 / K002 收货方</text>
<text x="953.5" y="505.0" font-size="11.5" fill="#354a5f" text-anchor="start" font-weight="400">Z1 10000000–19999999</text>
<rect x="40.0" y="554.0" width="1200.0" height="134.0" rx="12" fill="#fdf3d7" stroke="#8d6e00" stroke-width="1.2"/>
<text x="58.0" y="582.0" font-size="15.5" fill="#8d6e00" text-anchor="start" font-weight="700">④ 供应商主数据 · LFA1 / LFB1 / LFM1</text>
<text x="349.4" y="582.0" font-size="12" fill="#6b7a8d" text-anchor="start" font-weight="400">FI 维护前两层，MM 维护采购层</text>
<rect x="58.0" y="600.0" width="280.5" height="76.0" rx="8" fill="#ffffff" stroke="#8d6e00" stroke-width="1.2"/>
<text x="70.0" y="621.0" font-size="13.5" fill="#8d6e00" text-anchor="start" font-weight="700">一般数据（LFA1）</text>
<text x="70.0" y="638.0" font-size="11.5" fill="#354a5f" text-anchor="start" font-weight="400">名称、地址、税号、银行</text>
<rect x="352.5" y="600.0" width="280.5" height="76.0" rx="8" fill="#ffffff" stroke="#8d6e00" stroke-width="1.2"/>
<text x="364.5" y="621.0" font-size="13.5" fill="#8d6e00" text-anchor="start" font-weight="700">公司代码数据（LFB1）</text>
<text x="364.5" y="638.0" font-size="11.5" fill="#354a5f" text-anchor="start" font-weight="400">统驭科目 21210101、</text>
<text x="364.5" y="655.0" font-size="11.5" fill="#354a5f" text-anchor="start" font-weight="400">付款条件、容差组</text>
<rect x="647.0" y="600.0" width="280.5" height="76.0" rx="8" fill="#ffffff" stroke="#8d6e00" stroke-width="1.2"/>
<text x="659.0" y="621.0" font-size="13.5" fill="#8d6e00" text-anchor="start" font-weight="700">采购数据（LFM1）</text>
<text x="659.0" y="638.0" font-size="11.5" fill="#354a5f" text-anchor="start" font-weight="400">采购组织层（MM 的 MK01 维护）</text>
<rect x="941.5" y="600.0" width="280.5" height="76.0" rx="8" fill="#ffffff" stroke="#8d6e00" stroke-width="1.2"/>
<text x="953.5" y="621.0" font-size="13.5" fill="#8d6e00" text-anchor="start" font-weight="700">账户组与编号范围</text>
<text x="953.5" y="638.0" font-size="11.5" fill="#354a5f" text-anchor="start" font-weight="400">G001/G002/G003</text>
<text x="953.5" y="655.0" font-size="11.5" fill="#354a5f" text-anchor="start" font-weight="400">Z2 20000000–29999999</text>
</svg>
