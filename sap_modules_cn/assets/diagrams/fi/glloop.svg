<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 252" width="1280" height="252" role="img" aria-label="总账闭环：建科目 → 录凭证 → 过账 → 余额 → 清点" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif">
<title>总账闭环：建科目 → 录凭证 → 过账 → 余额 → 清点</title>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0a6ed1"/></marker><marker id="ar2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#007272"/></marker><marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ffffff"/></marker><marker id="arback" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M10,0 L0,5 L10,10 z" fill="#b3261e"/></marker></defs>
<rect width="1280" height="252" fill="#ffffff"/>
<text x="40.0" y="46.0" font-size="22" fill="#1d2d3e" text-anchor="start" font-weight="700">总账闭环：建科目 → 录凭证 → 过账 → 余额 → 清点</text>
<text x="40.0" y="72.0" font-size="12.5" fill="#6b7a8d" text-anchor="start" font-weight="400">教材任务 10–14、20、21 的顺序；左边是准备，右边是日常</text>
<rect x="40.0" y="104.0" width="150.0" height="51.0" rx="9" fill="#e3f0fa" stroke="#0a6ed1" stroke-width="1.5"/>
<circle cx="58.0" cy="122.0" r="12" fill="#0a6ed1"/><text x="58.0" y="126.3" font-size="11.5" fill="#ffffff" text-anchor="middle" font-weight="700">1</text>
<text x="76.0" y="127.0" font-size="14" fill="#0a6ed1" text-anchor="start" font-weight="700">建科目 FS00</text>
<text x="52.0" y="146.0" font-size="11.5" fill="#354a5f" text-anchor="start" font-weight="400">科目表层 +</text>
<text x="52.0" y="163.0" font-size="11.5" fill="#354a5f" text-anchor="start" font-weight="400">公司代码层（任务</text>
<text x="52.0" y="180.0" font-size="11.5" fill="#354a5f" text-anchor="start" font-weight="400">10–13）</text>
<path d="M 192 130 H 216" fill="none" stroke="#0a6ed1" stroke-width="1.8" marker-end="url(#ar)"/>
<rect x="220.0" y="104.0" width="150.0" height="51.0" rx="9" fill="#e3f0fa" stroke="#0a6ed1" stroke-width="1.5"/>
<circle cx="238.0" cy="122.0" r="12" fill="#0a6ed1"/><text x="238.0" y="126.3" font-size="11.5" fill="#ffffff" text-anchor="middle" font-weight="700">2</text>
<text x="256.0" y="127.0" font-size="14" fill="#0a6ed1" text-anchor="start" font-weight="700">清点科目</text>
<text x="232.0" y="146.0" font-size="11.5" fill="#354a5f" text-anchor="start" font-weight="400">科目汇总</text>
<text x="232.0" y="163.0" font-size="11.5" fill="#354a5f" text-anchor="start" font-weight="400">S_alr_87012326（任务</text>
<text x="232.0" y="180.0" font-size="11.5" fill="#354a5f" text-anchor="start" font-weight="400"> 14）</text>
<path d="M 372 130 H 396" fill="none" stroke="#0a6ed1" stroke-width="1.8" marker-end="url(#ar)"/>
<rect x="400.0" y="104.0" width="150.0" height="51.0" rx="9" fill="#e6f2f2" stroke="#007272" stroke-width="1.5"/>
<circle cx="418.0" cy="122.0" r="12" fill="#007272"/><text x="418.0" y="126.3" font-size="11.5" fill="#ffffff" text-anchor="middle" font-weight="700">3</text>
<text x="436.0" y="127.0" font-size="14" fill="#007272" text-anchor="start" font-weight="700">录凭证 FB50</text>
<text x="412.0" y="146.0" font-size="11.5" fill="#354a5f" text-anchor="start" font-weight="400">借 10020101 / 贷</text>
<text x="412.0" y="163.0" font-size="11.5" fill="#354a5f" text-anchor="start" font-weight="400">31010101（任务 20）</text>
<path d="M 552 130 H 576" fill="none" stroke="#007272" stroke-width="1.8" marker-end="url(#ar)"/>
<rect x="580.0" y="104.0" width="150.0" height="51.0" rx="9" fill="#e6f2f2" stroke="#007272" stroke-width="1.5"/>
<circle cx="598.0" cy="122.0" r="12" fill="#007272"/><text x="598.0" y="126.3" font-size="11.5" fill="#ffffff" text-anchor="middle" font-weight="700">4</text>
<text x="616.0" y="127.0" font-size="14" fill="#007272" text-anchor="start" font-weight="700">过账与回查</text>
<text x="592.0" y="146.0" font-size="11.5" fill="#354a5f" text-anchor="start" font-weight="400">凭证 100000000；FB03</text>
<text x="592.0" y="163.0" font-size="11.5" fill="#354a5f" text-anchor="start" font-weight="400"> 看分录</text>
<path d="M 732 130 H 756" fill="none" stroke="#007272" stroke-width="1.8" marker-end="url(#ar)"/>
<rect x="760.0" y="104.0" width="150.0" height="51.0" rx="9" fill="#fdf3d7" stroke="#8d6e00" stroke-width="1.5"/>
<circle cx="778.0" cy="122.0" r="12" fill="#8d6e00"/><text x="778.0" y="126.3" font-size="11.5" fill="#ffffff" text-anchor="middle" font-weight="700">5</text>
<text x="796.0" y="127.0" font-size="14" fill="#8d6e00" text-anchor="start" font-weight="700">看余额 FS10N</text>
<text x="772.0" y="146.0" font-size="11.5" fill="#354a5f" text-anchor="start" font-weight="400">按科目 + 公司代码 +</text>
<text x="772.0" y="163.0" font-size="11.5" fill="#354a5f" text-anchor="start" font-weight="400">年度 + 期间（任务 21）</text>
<path d="M 912 130 H 936" fill="none" stroke="#8d6e00" stroke-width="1.8" marker-end="url(#ar)"/>
<rect x="940.0" y="104.0" width="150.0" height="51.0" rx="9" fill="#e6f2ec" stroke="#177245" stroke-width="1.5"/>
<circle cx="958.0" cy="122.0" r="12" fill="#177245"/><text x="958.0" y="126.3" font-size="11.5" fill="#ffffff" text-anchor="middle" font-weight="700">6</text>
<text x="976.0" y="127.0" font-size="14" fill="#177245" text-anchor="start" font-weight="700">余额表与报表</text>
<text x="952.0" y="146.0" font-size="11.5" fill="#354a5f" text-anchor="start" font-weight="400">S_ALR_87012276 →</text>
<text x="952.0" y="163.0" font-size="11.5" fill="#354a5f" text-anchor="start" font-weight="400">报表结构（任务</text>
<text x="952.0" y="180.0" font-size="11.5" fill="#354a5f" text-anchor="start" font-weight="400">42/44）</text>
<rect x="40.0" y="204.0" width="1200.0" height="34.5" rx="8" fill="#e3f0fa" stroke="#0a6ed1" stroke-width="1.2"/>
<text x="52.0" y="226.0" font-size="12.5" fill="#0854a0" text-anchor="start" font-weight="400">总账的「闭环」就是这六步：科目建错 → 凭证记不进；凭证没过账 → 余额查不到；期间关了 → 只能下个月再记。每一步都能在教材里找到对应画面。</text>
</svg>
