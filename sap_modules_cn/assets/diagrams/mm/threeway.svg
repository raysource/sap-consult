<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 706" width="1280" height="706" role="img" aria-label="三单匹配与差异处理（发票校验的核心）" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif">
<title>三单匹配与差异处理（发票校验的核心）</title>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0a6ed1"/></marker><marker id="ar2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#007272"/></marker><marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ffffff"/></marker><marker id="arback" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M10,0 L0,5 L10,10 z" fill="#b3261e"/></marker></defs>
<rect width="1280" height="706" fill="#ffffff"/>
<text x="40.0" y="46.0" font-size="22" fill="#1d2d3e" text-anchor="start" font-weight="700">三单匹配与差异处理（发票校验的核心）</text>
<text x="40.0" y="72.0" font-size="12.5" fill="#6b7a8d" text-anchor="start" font-weight="400">MIRO 保存时系统按容差逐项检查，超限就冻结 —— 冻结不是错误，是控制</text>
<rect x="40.0" y="106.0" width="1200.0" height="128.0" rx="9" fill="#e3f0fa" stroke="#0a6ed1" stroke-width="1.4"/>
<rect x="40.0" y="106.0" width="4.5" height="128.0" rx="2" fill="#0a6ed1" stroke="#0a6ed1" stroke-width="1.4"/>
<text x="58.0" y="134.0" font-size="15.5" fill="#0a6ed1" text-anchor="start" font-weight="700">匹配 1：数量 —— 发票 ↔ 收货</text>
<rect x="58.0" y="158.0" width="91.0" height="34.0" rx="8" fill="#ffffff" stroke="#0a6ed1" stroke-width="1.2"/>
<text x="69.0" y="173.5" font-size="11.5" fill="#354a5f" text-anchor="start" font-weight="400">采购订单数量</text>
<path d="M 150 169 h 12" fill="none" stroke="#0a6ed1" stroke-width="1.3" marker-end="url(#ar)"/>
<rect x="165.0" y="158.0" width="118.3" height="34.0" rx="8" fill="#ffffff" stroke="#0a6ed1" stroke-width="1.2"/>
<text x="176.0" y="173.5" font-size="11.5" fill="#354a5f" text-anchor="start" font-weight="400">收货数量（MIGO）</text>
<path d="M 284 169 h 12" fill="none" stroke="#0a6ed1" stroke-width="1.3" marker-end="url(#ar)"/>
<rect x="299.3" y="158.0" width="118.3" height="34.0" rx="8" fill="#ffffff" stroke="#0a6ed1" stroke-width="1.2"/>
<text x="310.3" y="173.5" font-size="11.5" fill="#354a5f" text-anchor="start" font-weight="400">发票数量（MIRO）</text>
<path d="M 419 169 h 12" fill="none" stroke="#0a6ed1" stroke-width="1.3" marker-end="url(#ar)"/>
<rect x="433.5" y="158.0" width="82.0" height="34.0" rx="8" fill="#ffffff" stroke="#0a6ed1" stroke-width="1.2"/>
<text x="444.5" y="173.5" font-size="11.5" fill="#354a5f" text-anchor="start" font-weight="400">差异 → 容差</text>
<path d="M 516 169 h 12" fill="none" stroke="#0a6ed1" stroke-width="1.3" marker-end="url(#ar)"/>
<text x="58.0" y="206.0" font-size="12" fill="#354a5f" text-anchor="start" font-weight="400">基于收货的发票校验（GR-based IV）下，发票数量不能超过已收货数量；收货容差 B1 超了报错、B2 超了只警告（教材任务 31）。</text>
<rect x="40.0" y="250.0" width="1200.0" height="128.0" rx="9" fill="#e6f2f2" stroke="#007272" stroke-width="1.4"/>
<rect x="40.0" y="250.0" width="4.5" height="128.0" rx="2" fill="#007272" stroke="#007272" stroke-width="1.4"/>
<text x="58.0" y="278.0" font-size="15.5" fill="#007272" text-anchor="start" font-weight="700">匹配 2：价格 —— 发票 ↔ 采购订单</text>
<rect x="58.0" y="302.0" width="68.0" height="34.0" rx="8" fill="#ffffff" stroke="#007272" stroke-width="1.2"/>
<text x="69.0" y="317.5" font-size="11.5" fill="#354a5f" text-anchor="start" font-weight="400">订单净价</text>
<path d="M 127 313 h 12" fill="none" stroke="#007272" stroke-width="1.3" marker-end="url(#ar)"/>
<rect x="142.0" y="302.0" width="91.0" height="34.0" rx="8" fill="#ffffff" stroke="#007272" stroke-width="1.2"/>
<text x="153.0" y="317.5" font-size="11.5" fill="#354a5f" text-anchor="start" font-weight="400">信息记录条件</text>
<path d="M 234 313 h 12" fill="none" stroke="#007272" stroke-width="1.3" marker-end="url(#ar)"/>
<rect x="249.0" y="302.0" width="68.0" height="34.0" rx="8" fill="#ffffff" stroke="#007272" stroke-width="1.2"/>
<text x="260.0" y="317.5" font-size="11.5" fill="#354a5f" text-anchor="start" font-weight="400">发票单价</text>
<path d="M 318 313 h 12" fill="none" stroke="#007272" stroke-width="1.3" marker-end="url(#ar)"/>
<rect x="333.0" y="302.0" width="101.8" height="34.0" rx="8" fill="#ffffff" stroke="#007272" stroke-width="1.2"/>
<text x="344.0" y="317.5" font-size="11.5" fill="#354a5f" text-anchor="start" font-weight="400">价格差异 → PRD</text>
<path d="M 436 313 h 12" fill="none" stroke="#007272" stroke-width="1.3" marker-end="url(#ar)"/>
<text x="58.0" y="350.0" font-size="12" fill="#354a5f" text-anchor="start" font-weight="400">价格差异超容差（教材任务 30 的 PE/SE）先冻结；若是标准价物料，实际采购价与标准价之差进「采购价差」科目 54010301。</text>
<rect x="40.0" y="394.0" width="1200.0" height="146.0" rx="9" fill="#fdf3d7" stroke="#8d6e00" stroke-width="1.4"/>
<rect x="40.0" y="394.0" width="4.5" height="146.0" rx="2" fill="#8d6e00" stroke="#8d6e00" stroke-width="1.4"/>
<text x="58.0" y="422.0" font-size="15.5" fill="#8d6e00" text-anchor="start" font-weight="700">匹配 3：税额与总额</text>
<rect x="58.0" y="446.0" width="110.8" height="34.0" rx="8" fill="#ffffff" stroke="#8d6e00" stroke-width="1.2"/>
<text x="69.0" y="461.5" font-size="11.5" fill="#354a5f" text-anchor="start" font-weight="400">订单税码（13%）</text>
<path d="M 170 457 h 12" fill="none" stroke="#8d6e00" stroke-width="1.3" marker-end="url(#ar)"/>
<rect x="184.8" y="446.0" width="114.0" height="34.0" rx="8" fill="#ffffff" stroke="#8d6e00" stroke-width="1.2"/>
<text x="195.8" y="461.5" font-size="11.5" fill="#354a5f" text-anchor="start" font-weight="400">「计算税额」勾选</text>
<path d="M 300 457 h 12" fill="none" stroke="#8d6e00" stroke-width="1.3" marker-end="url(#ar)"/>
<rect x="314.8" y="446.0" width="65.6" height="34.0" rx="8" fill="#ffffff" stroke="#8d6e00" stroke-width="1.2"/>
<text x="325.8" y="461.5" font-size="11.5" fill="#354a5f" text-anchor="start" font-weight="400">余额 = 0</text>
<path d="M 381 457 h 12" fill="none" stroke="#8d6e00" stroke-width="1.3" marker-end="url(#ar)"/>
<rect x="396.4" y="446.0" width="97.6" height="34.0" rx="8" fill="#ffffff" stroke="#8d6e00" stroke-width="1.2"/>
<text x="407.4" y="461.5" font-size="11.5" fill="#354a5f" text-anchor="start" font-weight="400">否则冻结/拒绝</text>
<path d="M 495 457 h 12" fill="none" stroke="#8d6e00" stroke-width="1.3" marker-end="url(#ar)"/>
<text x="58.0" y="494.0" font-size="12" fill="#354a5f" text-anchor="start" font-weight="400">教材做法：勾「计算税额」→ 回车 → 把余额拷进金额列，使余额归零。</text>
<text x="58.0" y="512.0" font-size="12" fill="#354a5f" text-anchor="start" font-weight="400">税额/日期类差异由 DQ/DW/ST 等容差码控制。</text>
<rect x="40.0" y="556.0" width="1200.0" height="128.0" rx="9" fill="#fdeae9" stroke="#b3261e" stroke-width="1.4"/>
<rect x="40.0" y="556.0" width="4.5" height="128.0" rx="2" fill="#b3261e" stroke="#b3261e" stroke-width="1.4"/>
<text x="58.0" y="584.0" font-size="15.5" fill="#b3261e" text-anchor="start" font-weight="700">超限之后：冻结 → 检查 → 下达</text>
<rect x="58.0" y="608.0" width="79.5" height="34.0" rx="8" fill="#ffffff" stroke="#b3261e" stroke-width="1.2"/>
<text x="69.0" y="623.5" font-size="11.5" fill="#354a5f" text-anchor="start" font-weight="400">发票被冻结</text>
<path d="M 138 619 h 12" fill="none" stroke="#b3261e" stroke-width="1.3" marker-end="url(#ar)"/>
<rect x="153.5" y="608.0" width="90.4" height="34.0" rx="8" fill="#ffffff" stroke="#b3261e" stroke-width="1.2"/>
<text x="164.5" y="623.5" font-size="11.5" fill="#354a5f" text-anchor="start" font-weight="400">MRBR 查原因</text>
<path d="M 245 619 h 12" fill="none" stroke="#b3261e" stroke-width="1.3" marker-end="url(#ar)"/>
<rect x="259.9" y="608.0" width="91.0" height="34.0" rx="8" fill="#ffffff" stroke="#b3261e" stroke-width="1.2"/>
<text x="270.9" y="623.5" font-size="11.5" fill="#354a5f" text-anchor="start" font-weight="400">与供应商核对</text>
<path d="M 352 619 h 12" fill="none" stroke="#b3261e" stroke-width="1.3" marker-end="url(#ar)"/>
<rect x="366.9" y="608.0" width="136.4" height="34.0" rx="8" fill="#ffffff" stroke="#b3261e" stroke-width="1.2"/>
<text x="377.9" y="623.5" font-size="11.5" fill="#354a5f" text-anchor="start" font-weight="400">下达或冲销（MR8M）</text>
<path d="M 504 619 h 12" fill="none" stroke="#b3261e" stroke-width="1.3" marker-end="url(#ar)"/>
<text x="58.0" y="656.0" font-size="12" fill="#354a5f" text-anchor="start" font-weight="400">冻结只影响付款，不影响发票凭证本身；下达由 MRBR 完成（教材任务 40），冲销用 MR8M。长期挂账的 GR/IR 用 MB5S 查、MR11 清理。</text>
</svg>
