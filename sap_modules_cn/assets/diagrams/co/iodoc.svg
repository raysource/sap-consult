<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 367" width="1280" height="367" role="img" aria-label="内部订单的生命周期（教材任务 27–34）" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif">
<title>内部订单的生命周期（教材任务 27–34）</title>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0a6ed1"/></marker><marker id="ar2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#007272"/></marker><marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ffffff"/></marker><marker id="arback" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M10,0 L0,5 L10,10 z" fill="#b3261e"/></marker></defs>
<rect width="1280" height="367" fill="#ffffff"/>
<text x="40.0" y="46.0" font-size="22" fill="#1d2d3e" text-anchor="start" font-weight="700">内部订单的生命周期（教材任务 27–34）</text>
<text x="40.0" y="72.0" font-size="12.5" fill="#6b7a8d" text-anchor="start" font-weight="400">配置在前、业务在后：订单类型与结算配置不齐，KO88 一定跑不动</text>
<rect x="40.0" y="104.0" width="178.3" height="51.0" rx="9" fill="#e3f0fa" stroke="#0a6ed1" stroke-width="1.5"/>
<circle cx="58.0" cy="122.0" r="12" fill="#0a6ed1"/><text x="58.0" y="126.3" font-size="11.5" fill="#ffffff" text-anchor="middle" font-weight="700">1</text>
<text x="76.0" y="127.0" font-size="14" fill="#0a6ed1" text-anchor="start" font-weight="700">定义订单类型 PMKT</text>
<text x="52.0" y="146.0" font-size="11.5" fill="#354a5f" text-anchor="start" font-weight="400">IMG：内部订单 → 订单主数据</text>
<path d="M 220 130 H 244" fill="none" stroke="#0a6ed1" stroke-width="1.8" marker-end="url(#ar)"/>
<rect x="248.3" y="104.0" width="205.0" height="51.0" rx="9" fill="#e3f0fa" stroke="#0a6ed1" stroke-width="1.5"/>
<circle cx="266.3" cy="122.0" r="12" fill="#0a6ed1"/><text x="266.3" y="126.3" font-size="11.5" fill="#ffffff" text-anchor="middle" font-weight="700">2</text>
<text x="284.3" y="127.0" font-size="14" fill="#0a6ed1" text-anchor="start" font-weight="700">结算参数文件与分配结构</text>
<text x="260.3" y="146.0" font-size="11.5" fill="#354a5f" text-anchor="start" font-weight="400">任务 28/29：A1 → 803010</text>
<path d="M 455 130 H 479" fill="none" stroke="#0a6ed1" stroke-width="1.8" marker-end="url(#ar)"/>
<rect x="483.3" y="104.0" width="166.0" height="51.0" rx="9" fill="#e6f2f2" stroke="#007272" stroke-width="1.5"/>
<circle cx="501.3" cy="122.0" r="12" fill="#007272"/><text x="501.3" y="126.3" font-size="11.5" fill="#ffffff" text-anchor="middle" font-weight="700">3</text>
<text x="519.3" y="127.0" font-size="14" fill="#007272" text-anchor="start" font-weight="700">结算凭证编号范围</text>
<text x="495.3" y="146.0" font-size="11.5" fill="#354a5f" text-anchor="start" font-weight="400">任务 30：C999</text>
<text x="495.3" y="163.0" font-size="11.5" fill="#354a5f" text-anchor="start" font-weight="400">分到编号范围</text>
<path d="M 651 130 H 675" fill="none" stroke="#007272" stroke-width="1.8" marker-end="url(#ar)"/>
<rect x="679.3" y="104.0" width="171.1" height="51.0" rx="9" fill="#e6f2f2" stroke="#007272" stroke-width="1.5"/>
<circle cx="697.3" cy="122.0" r="12" fill="#007272"/><text x="697.3" y="126.3" font-size="11.5" fill="#ffffff" text-anchor="middle" font-weight="700">4</text>
<text x="715.3" y="127.0" font-size="14" fill="#007272" text-anchor="start" font-weight="700">KO04 建单 500000</text>
<text x="691.3" y="146.0" font-size="11.5" fill="#354a5f" text-anchor="start" font-weight="400">任务 31：维护结算规则份额</text>
<path d="M 852 130 H 876" fill="none" stroke="#007272" stroke-width="1.8" marker-end="url(#ar)"/>
<rect x="880.4" y="104.0" width="150.0" height="51.0" rx="9" fill="#fdf3d7" stroke="#8d6e00" stroke-width="1.5"/>
<circle cx="898.4" cy="122.0" r="12" fill="#8d6e00"/><text x="898.4" y="126.3" font-size="11.5" fill="#ffffff" text-anchor="middle" font-weight="700">5</text>
<text x="916.4" y="127.0" font-size="14" fill="#8d6e00" text-anchor="start" font-weight="700">FB50 归集费用</text>
<text x="892.4" y="146.0" font-size="11.5" fill="#354a5f" text-anchor="start" font-weight="400">任务</text>
<text x="892.4" y="163.0" font-size="11.5" fill="#354a5f" text-anchor="start" font-weight="400">32：行项目填订单号</text>
<path d="M 1032 130 H 1056" fill="none" stroke="#8d6e00" stroke-width="1.8" marker-end="url(#ar)"/>
<rect x="1060.4" y="104.0" width="150.0" height="51.0" rx="9" fill="#fdeae9" stroke="#b3261e" stroke-width="1.5"/>
<circle cx="1078.4" cy="122.0" r="12" fill="#b3261e"/><text x="1078.4" y="126.3" font-size="11.5" fill="#ffffff" text-anchor="middle" font-weight="700">6</text>
<text x="1096.4" y="127.0" font-size="14" fill="#b3261e" text-anchor="start" font-weight="700">KO88 结算</text>
<text x="1072.4" y="146.0" font-size="11.5" fill="#354a5f" text-anchor="start" font-weight="400">任务 33：期间 003 /</text>
<text x="1072.4" y="163.0" font-size="11.5" fill="#354a5f" text-anchor="start" font-weight="400">2021</text>
<path d="M 1212 130 h 14 V 164 H 20 V 226 h -14" fill="none" stroke="#b3261e" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ar)"/>
<rect x="40.0" y="200.0" width="150.0" height="51.0" rx="9" fill="#e6f2ec" stroke="#177245" stroke-width="1.5"/>
<circle cx="58.0" cy="218.0" r="12" fill="#177245"/><text x="58.0" y="222.3" font-size="11.5" fill="#ffffff" text-anchor="middle" font-weight="700">7</text>
<text x="76.0" y="223.0" font-size="14" fill="#177245" text-anchor="start" font-weight="700">报表确认</text>
<text x="52.0" y="242.0" font-size="11.5" fill="#354a5f" text-anchor="start" font-weight="400">任务</text>
<text x="52.0" y="259.0" font-size="11.5" fill="#354a5f" text-anchor="start" font-weight="400">34：余额清零、接收方</text>
<text x="52.0" y="276.0" font-size="11.5" fill="#354a5f" text-anchor="start" font-weight="400">有数</text>
<rect x="40.0" y="300.0" width="1200.0" height="53.0" rx="8" fill="#e3f0fa" stroke="#0a6ed1" stroke-width="1.2"/>
<text x="52.0" y="322.0" font-size="12.5" fill="#0854a0" text-anchor="start" font-weight="400">教材场景：颐宁公司办「国内用户大会」，为了单独核算费用建了市场活动类型的内部订单 500000，活动结束把费用结算到 8 个成本中心（1001 20% · 1002 15% · 2001 5% · 2002 5% · 2003 30% · 2004 10% ·</text>
<text x="52.0" y="340.5" font-size="12.5" fill="#0854a0" text-anchor="start" font-weight="400"> 2005 10% · 2006 5%）。</text>
</svg>
