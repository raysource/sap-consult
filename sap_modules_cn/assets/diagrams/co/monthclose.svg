<rect width="1400" height="384" fill="#ffffff"/>
<text x="40.0" y="46.0" font-size="22" fill="#1d2d3e" text-anchor="start" font-weight="700">CO 月结泳道图：从费用归集到报表确认</text>
<text x="40.0" y="72.0" font-size="12.5" fill="#6b7a8d" text-anchor="start" font-weight="400">教材任务 14–34 覆盖了全部环节；顺序错了不会报错，但报表会「看起来对、其实不对」</text>
