<text x="409.4" y="127.0" font-size="12.5" fill="#1d2d3e" text-anchor="middle" font-weight="700">② 报表检查</text>
<text x="409.4" y="144.0" font-size="11" fill="#6b7a8d" text-anchor="middle" font-weight="400">任务 16</text>
<text x="555.6" y="127.0" font-size="12.5" fill="#1d2d3e" text-anchor="middle" font-weight="700">③ 重过账</text>
<text x="555.6" y="144.0" font-size="11" fill="#6b7a8d" text-anchor="middle" font-weight="400">KB61</text>
