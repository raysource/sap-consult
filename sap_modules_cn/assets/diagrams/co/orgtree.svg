<text x="51.0" y="264.0" font-size="11.5" fill="#354a5f" text-anchor="start" font-weight="400">FI 的法人单位，OX19 分配给控制范围</text>
<rect x="515.0" y="226.0" width="250.0" height="56.0" rx="9" fill="#efeaf9" stroke="#5b3fa8" stroke-width="1.4"/>
<text x="526.0" y="247.0" font-size="13.5" fill="#5b3fa8" text-anchor="start" font-weight="700">标准层次：C999 颐宁成本中心</text>
<text x="526.0" y="264.0" font-size="11.5" fill="#354a5f" text-anchor="start" font-weight="400">OKEON 维护；报表按这棵树上卷</text>
<rect x="990.0" y="226.0" width="250.0" height="72.0" rx="9" fill="#f2f5f8" stroke="#6b7a8d" stroke-width="1.4"/>
