<text x="526.0" y="146.0" font-size="11.5" fill="#354a5f" text-anchor="start" font-weight="400">CO 的边界：成本要素、成本中心、</text>
<text x="526.0" y="162.0" font-size="11.5" fill="#354a5f" text-anchor="start" font-weight="400">内部订单、循环都归属它（颐宁机械有限公</text>
<text x="526.0" y="178.0" font-size="11.5" fill="#354a5f" text-anchor="start" font-weight="400">司）</text>
<rect x="40.0" y="226.0" width="250.0" height="56.0" rx="9" fill="#e6f2f2" stroke="#007272" stroke-width="1.4"/>
