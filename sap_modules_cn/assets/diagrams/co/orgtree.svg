<rect width="1280" height="470" fill="#ffffff"/>
<text x="40.0" y="46.0" font-size="22" fill="#1d2d3e" text-anchor="start" font-weight="700">CO 组织结构与成本对象</text>
<text x="40.0" y="72.0" font-size="12.5" fill="#6b7a8d" text-anchor="start" font-weight="400">教材场景：成本控制范围 C999 / 公司代码 C999 / 标准层次 HQ 总部与 MFG 制造部 / 内部订单 500000</text>
