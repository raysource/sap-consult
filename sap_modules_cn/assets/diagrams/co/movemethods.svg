<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 688" width="1280" height="688" role="img" aria-label="三种「搬成本」的方式 + 一种纠错方式" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif">
<title>三种「搬成本」的方式 + 一种纠错方式</title>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0a6ed1"/></marker><marker id="ar2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#007272"/></marker><marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ffffff"/></marker><marker id="arback" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M10,0 L0,5 L10,10 z" fill="#b3261e"/></marker></defs>
<rect width="1280" height="688" fill="#ffffff"/>
<text x="40.0" y="46.0" font-size="22" fill="#1d2d3e" text-anchor="start" font-weight="700">三种「搬成本」的方式 + 一种纠错方式</text>
<text x="40.0" y="72.0" font-size="12.5" fill="#6b7a8d" text-anchor="start" font-weight="400">教材任务 17 / 21 / 24 / 33 分别演示了它们；判据是「成本要素形态有没有变」</text>
<rect x="40.0" y="106.0" width="1200.0" height="128.0" rx="9" fill="#fdf3d7" stroke="#8d6e00" stroke-width="1.4"/>
<rect x="40.0" y="106.0" width="4.5" height="128.0" rx="2" fill="#8d6e00" stroke="#8d6e00" stroke-width="1.4"/>
<text x="58.0" y="134.0" font-size="15.5" fill="#8d6e00" text-anchor="start" font-weight="700">重过账 Reposting（KB61，任务 17）—— 纠错用</text>
<rect x="58.0" y="158.0" width="180.9" height="34.0" rx="8" fill="#ffffff" stroke="#8d6e00" stroke-width="1.2"/>
<text x="69.0" y="173.5" font-size="11.5" fill="#354a5f" text-anchor="start" font-weight="400">原行项目：2001 的租金 90000</text>
<path d="M 240 169 h 12" fill="none" stroke="#8d6e00" stroke-width="1.3" marker-end="url(#ar)"/>
<rect x="254.9" y="158.0" width="113.3" height="34.0" rx="8" fill="#ffffff" stroke="#8d6e00" stroke-width="1.2"/>
<text x="265.9" y="173.5" font-size="11.5" fill="#354a5f" text-anchor="start" font-weight="400">改为 2006 行政部</text>
<path d="M 369 169 h 12" fill="none" stroke="#8d6e00" stroke-width="1.3" marker-end="url(#ar)"/>
<rect x="384.2" y="158.0" width="91.0" height="34.0" rx="8" fill="#ffffff" stroke="#8d6e00" stroke-width="1.2"/>
<text x="395.2" y="173.5" font-size="11.5" fill="#354a5f" text-anchor="start" font-weight="400">成本要素不变</text>
<path d="M 476 169 h 12" fill="none" stroke="#8d6e00" stroke-width="1.3" marker-end="url(#ar)"/>
<rect x="491.2" y="158.0" width="97.2" height="34.0" rx="8" fill="#ffffff" stroke="#8d6e00" stroke-width="1.2"/>
<text x="502.2" y="173.5" font-size="11.5" fill="#354a5f" text-anchor="start" font-weight="400">不产生 FI 凭证</text>
<path d="M 589 169 h 12" fill="none" stroke="#8d6e00" stroke-width="1.3" marker-end="url(#ar)"/>
<text x="58.0" y="206.0" font-size="12" fill="#354a5f" text-anchor="start" font-weight="400">适用场景：费用记错了成本对象。CO 只改成本对象，FI 的会计凭证与科目余额完全不动 —— 这是「CO 与 FI 各管一段」最直观的例子。</text>
<rect x="40.0" y="250.0" width="1200.0" height="128.0" rx="9" fill="#e3f0fa" stroke="#0a6ed1" stroke-width="1.4"/>
<rect x="40.0" y="250.0" width="4.5" height="128.0" rx="2" fill="#0a6ed1" stroke="#0a6ed1" stroke-width="1.4"/>
<text x="58.0" y="278.0" font-size="15.5" fill="#0a6ed1" text-anchor="start" font-weight="700">分配 Distribution（KSV5，任务 20/21）—— 初级成本要素</text>
<rect x="58.0" y="302.0" width="180.2" height="34.0" rx="8" fill="#ffffff" stroke="#0a6ed1" stroke-width="1.2"/>
<text x="69.0" y="317.5" font-size="11.5" fill="#354a5f" text-anchor="start" font-weight="400">发送方 2006 + 55020141 租金</text>
<path d="M 239 313 h 12" fill="none" stroke="#0a6ed1" stroke-width="1.3" marker-end="url(#ar)"/>
<rect x="254.2" y="302.0" width="159.3" height="34.0" rx="8" fill="#ffffff" stroke="#0a6ed1" stroke-width="1.2"/>
<text x="265.2" y="317.5" font-size="11.5" fill="#354a5f" text-anchor="start" font-weight="400">追踪因素 RENT 实际统计值</text>
<path d="M 414 313 h 12" fill="none" stroke="#0a6ed1" stroke-width="1.3" marker-end="url(#ar)"/>
<rect x="429.5" y="302.0" width="134.6" height="34.0" rx="8" fill="#ffffff" stroke="#0a6ed1" stroke-width="1.2"/>
<text x="440.5" y="317.5" font-size="11.5" fill="#354a5f" text-anchor="start" font-weight="400">接收方 HQ 各成本中心</text>
<path d="M 565 313 h 12" fill="none" stroke="#0a6ed1" stroke-width="1.3" marker-end="url(#ar)"/>
<rect x="580.1" y="302.0" width="68.0" height="34.0" rx="8" fill="#ffffff" stroke="#0a6ed1" stroke-width="1.2"/>
<text x="591.1" y="317.5" font-size="11.5" fill="#354a5f" text-anchor="start" font-weight="400">形态不变</text>
<path d="M 649 313 h 12" fill="none" stroke="#0a6ed1" stroke-width="1.3" marker-end="url(#ar)"/>
<text x="58.0" y="350.0" font-size="12" fill="#354a5f" text-anchor="start" font-weight="400">接收方看到的还是「管理费用-租金」，所以能追溯原始成本要素。教材用它把办公物业的房租分给总部各成本中心（制造部不在这个物业里，不承担）。</text>
<rect x="40.0" y="394.0" width="1200.0" height="128.0" rx="9" fill="#e6f2f2" stroke="#007272" stroke-width="1.4"/>
<rect x="40.0" y="394.0" width="4.5" height="128.0" rx="2" fill="#007272" stroke="#007272" stroke-width="1.4"/>
<text x="58.0" y="422.0" font-size="15.5" fill="#007272" text-anchor="start" font-weight="700">分摊 Assessment（KSU5，任务 23/24）—— 次级成本要素</text>
<rect x="58.0" y="446.0" width="180.2" height="34.0" rx="8" fill="#ffffff" stroke="#007272" stroke-width="1.2"/>
<text x="69.0" y="461.5" font-size="11.5" fill="#354a5f" text-anchor="start" font-weight="400">发送方 2006 + 41050121 电费</text>
<path d="M 239 457 h 12" fill="none" stroke="#007272" stroke-width="1.3" marker-end="url(#ar)"/>
<rect x="254.2" y="446.0" width="134.4" height="34.0" rx="8" fill="#ffffff" stroke="#007272" stroke-width="1.2"/>
<text x="265.2" y="461.5" font-size="11.5" fill="#354a5f" text-anchor="start" font-weight="400">分摊成本要素 802010</text>
<path d="M 390 457 h 12" fill="none" stroke="#007272" stroke-width="1.3" marker-end="url(#ar)"/>
<rect x="404.5" y="446.0" width="174.1" height="34.0" rx="8" fill="#ffffff" stroke="#007272" stroke-width="1.2"/>
<text x="415.5" y="461.5" font-size="11.5" fill="#354a5f" text-anchor="start" font-weight="400">接收方 1001 75% / 1002 25%</text>
<path d="M 580 457 h 12" fill="none" stroke="#007272" stroke-width="1.3" marker-end="url(#ar)"/>
<rect x="594.6" y="446.0" width="68.0" height="34.0" rx="8" fill="#ffffff" stroke="#007272" stroke-width="1.2"/>
<text x="605.6" y="461.5" font-size="11.5" fill="#354a5f" text-anchor="start" font-weight="400">形态改变</text>
<path d="M 664 457 h 12" fill="none" stroke="#007272" stroke-width="1.3" marker-end="url(#ar)"/>
<text x="58.0" y="494.0" font-size="12" fill="#354a5f" text-anchor="start" font-weight="400">接收方看到的是「802010 电费分摊」而不是「电费」；它是次级成本要素，FI 里没有这个科目（教材任务 26 的原话）。要用固定百分比、权重或统计指标都可以。</text>
<rect x="40.0" y="538.0" width="1200.0" height="128.0" rx="9" fill="#fdeae9" stroke="#b3261e" stroke-width="1.4"/>
<rect x="40.0" y="538.0" width="4.5" height="128.0" rx="2" fill="#b3261e" stroke="#b3261e" stroke-width="1.4"/>
<text x="58.0" y="566.0" font-size="15.5" fill="#b3261e" text-anchor="start" font-weight="700">结算 Settlement（KO88，任务 33）—— 订单清账</text>
<rect x="58.0" y="590.0" width="149.5" height="34.0" rx="8" fill="#ffffff" stroke="#b3261e" stroke-width="1.2"/>
<text x="69.0" y="605.5" font-size="11.5" fill="#354a5f" text-anchor="start" font-weight="400">内部订单 500000 的余额</text>
<path d="M 209 601 h 12" fill="none" stroke="#b3261e" stroke-width="1.3" marker-end="url(#ar)"/>
<rect x="223.5" y="590.0" width="138.6" height="34.0" rx="8" fill="#ffffff" stroke="#b3261e" stroke-width="1.2"/>
<text x="234.5" y="605.5" font-size="11.5" fill="#354a5f" text-anchor="start" font-weight="400">分配结构 A1 → 803010</text>
<path d="M 363 601 h 12" fill="none" stroke="#b3261e" stroke-width="1.3" marker-end="url(#ar)"/>
<rect x="378.1" y="590.0" width="174.0" height="34.0" rx="8" fill="#ffffff" stroke="#b3261e" stroke-width="1.2"/>
<text x="389.1" y="605.5" font-size="11.5" fill="#354a5f" text-anchor="start" font-weight="400">接收方 8 个成本中心（份额）</text>
<path d="M 553 601 h 12" fill="none" stroke="#b3261e" stroke-width="1.3" marker-end="url(#ar)"/>
<rect x="568.1" y="590.0" width="68.0" height="34.0" rx="8" fill="#ffffff" stroke="#b3261e" stroke-width="1.2"/>
<text x="579.1" y="605.5" font-size="11.5" fill="#354a5f" text-anchor="start" font-weight="400">余额清零</text>
<path d="M 637 601 h 12" fill="none" stroke="#b3261e" stroke-width="1.3" marker-end="url(#ar)"/>
<text x="58.0" y="638.0" font-size="12" fill="#354a5f" text-anchor="start" font-weight="400">结算与分配/分摊的区别：它处理的是「订单」这个成本对象的期末余额；接收方与份额来自订单上的结算规则（合计必须 100%）。</text>
</svg>
