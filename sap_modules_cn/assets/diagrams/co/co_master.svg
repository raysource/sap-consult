<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 845" width="1280" height="845" role="img" aria-label="CO 主数据分层：从控制范围到明细规则" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif">
<title>CO 主数据分层：从控制范围到明细规则</title>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0a6ed1"/></marker><marker id="ar2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#007272"/></marker><marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ffffff"/></marker><marker id="arback" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M10,0 L0,5 L10,10 z" fill="#b3261e"/></marker></defs>
<rect width="1280" height="845" fill="#ffffff"/>
<text x="40.0" y="46.0" font-size="22" fill="#1d2d3e" text-anchor="start" font-weight="700">CO 主数据分层：从控制范围到明细规则</text>
<text x="40.0" y="72.0" font-size="12.5" fill="#6b7a8d" text-anchor="start" font-weight="400">同一个「部门成本」由四层数据共同决定：控制范围层 → 组层 → 成本中心层 → 明细与规则层</text>
<rect x="40.0" y="104.0" width="1200.0" height="134.0" rx="12" fill="#e3f0fa" stroke="#0a6ed1" stroke-width="1.2"/>
<text x="58.0" y="132.0" font-size="15.5" fill="#0a6ed1" text-anchor="start" font-weight="700">① 控制范围层（所有 CO 主数据的第一层键）· C999</text>
<text x="428.6" y="132.0" font-size="12" fill="#6b7a8d" text-anchor="start" font-weight="400">编号范围、版本、货币都由控制范围决定</text>
<rect x="58.0" y="150.0" width="280.5" height="76.0" rx="8" fill="#ffffff" stroke="#0a6ed1" stroke-width="1.2"/>
<text x="70.0" y="171.0" font-size="13.5" fill="#0a6ed1" text-anchor="start" font-weight="700">成本要素</text>
<text x="70.0" y="188.0" font-size="11.5" fill="#354a5f" text-anchor="start" font-weight="400">初级：与 FI 科目一致</text>
<text x="70.0" y="205.0" font-size="11.5" fill="#354a5f" text-anchor="start" font-weight="400">次级：801020 等 CO 专用</text>
<rect x="352.5" y="150.0" width="280.5" height="76.0" rx="8" fill="#ffffff" stroke="#0a6ed1" stroke-width="1.2"/>
<text x="364.5" y="171.0" font-size="13.5" fill="#0a6ed1" text-anchor="start" font-weight="700">成本中心</text>
<text x="364.5" y="188.0" font-size="11.5" fill="#354a5f" text-anchor="start" font-weight="400">编号在控制范围内唯一</text>
<text x="364.5" y="205.0" font-size="11.5" fill="#354a5f" text-anchor="start" font-weight="400">类别 W / F 决定可用字段</text>
<rect x="647.0" y="150.0" width="280.5" height="76.0" rx="8" fill="#ffffff" stroke="#0a6ed1" stroke-width="1.2"/>
<text x="659.0" y="171.0" font-size="13.5" fill="#0a6ed1" text-anchor="start" font-weight="700">作业类型</text>
<text x="659.0" y="188.0" font-size="11.5" fill="#354a5f" text-anchor="start" font-weight="400">LAB / MAC / SET，单位 H</text>
<text x="659.0" y="205.0" font-size="11.5" fill="#354a5f" text-anchor="start" font-weight="400">价格标志 1 自动算价</text>
<rect x="941.5" y="150.0" width="280.5" height="76.0" rx="8" fill="#ffffff" stroke="#0a6ed1" stroke-width="1.2"/>
<text x="953.5" y="171.0" font-size="13.5" fill="#0a6ed1" text-anchor="start" font-weight="700">统计指标</text>
<text x="953.5" y="188.0" font-size="11.5" fill="#354a5f" text-anchor="start" font-weight="400">RENT 物业租金面积（M2）</text>
<text x="953.5" y="205.0" font-size="11.5" fill="#354a5f" text-anchor="start" font-weight="400">只记数量，不记金额</text>
<rect x="40.0" y="254.0" width="1200.0" height="134.0" rx="12" fill="#e6f2f2" stroke="#007272" stroke-width="1.2"/>
<text x="58.0" y="282.0" font-size="15.5" fill="#007272" text-anchor="start" font-weight="700">② 成本中心组层（标准层次，决定报表上卷与循环接收方）</text>
<text x="475.4" y="282.0" font-size="12" fill="#6b7a8d" text-anchor="start" font-weight="400">任务 04 建的两个组</text>
<rect x="58.0" y="300.0" width="575.0" height="76.0" rx="8" fill="#ffffff" stroke="#007272" stroke-width="1.2"/>
<text x="70.0" y="321.0" font-size="13.5" fill="#007272" text-anchor="start" font-weight="700">HQ 总部</text>
<text x="70.0" y="338.0" font-size="11.5" fill="#354a5f" text-anchor="start" font-weight="400">2001–2006 六个成本中心</text>
<text x="70.0" y="355.0" font-size="11.5" fill="#354a5f" text-anchor="start" font-weight="400">租金分配的接收方</text>
<rect x="647.0" y="300.0" width="575.0" height="76.0" rx="8" fill="#ffffff" stroke="#007272" stroke-width="1.2"/>
<text x="659.0" y="321.0" font-size="13.5" fill="#007272" text-anchor="start" font-weight="700">MFG 制造部</text>
<text x="659.0" y="338.0" font-size="11.5" fill="#354a5f" text-anchor="start" font-weight="400">1001 Workshops · 1002 Warehouse</text>
<text x="659.0" y="355.0" font-size="11.5" fill="#354a5f" text-anchor="start" font-weight="400">电费分摊的接收方</text>
<rect x="40.0" y="404.0" width="1200.0" height="117.0" rx="12" fill="#e6f2ec" stroke="#177245" stroke-width="1.2"/>
<text x="58.0" y="432.0" font-size="15.5" fill="#177245" text-anchor="start" font-weight="700">③ 成本中心层（费用归集的最小单位、作业价格的载体）</text>
<text x="459.9" y="432.0" font-size="12" fill="#6b7a8d" text-anchor="start" font-weight="400">教材里费用就落在这一层</text>
<rect x="58.0" y="450.0" width="280.5" height="59.0" rx="8" fill="#ffffff" stroke="#177245" stroke-width="1.2"/>
<text x="70.0" y="471.0" font-size="13.5" fill="#177245" text-anchor="start" font-weight="700">2001 财务部</text>
<text x="70.0" y="488.0" font-size="11.5" fill="#354a5f" text-anchor="start" font-weight="400">房租 90000 元最初落在这里</text>
<rect x="352.5" y="450.0" width="280.5" height="59.0" rx="8" fill="#ffffff" stroke="#177245" stroke-width="1.2"/>
<text x="364.5" y="471.0" font-size="13.5" fill="#177245" text-anchor="start" font-weight="700">2006 行政部</text>
<text x="364.5" y="488.0" font-size="11.5" fill="#354a5f" text-anchor="start" font-weight="400">重过账后房租归它；电费 25500 元</text>
<rect x="647.0" y="450.0" width="280.5" height="59.0" rx="8" fill="#ffffff" stroke="#177245" stroke-width="1.2"/>
<text x="659.0" y="471.0" font-size="13.5" fill="#177245" text-anchor="start" font-weight="700">1001 Workshops</text>
<text x="659.0" y="488.0" font-size="11.5" fill="#354a5f" text-anchor="start" font-weight="400">作业价格：MAC 460/170、SET 300</text>
<rect x="941.5" y="450.0" width="280.5" height="59.0" rx="8" fill="#ffffff" stroke="#177245" stroke-width="1.2"/>
<text x="953.5" y="471.0" font-size="13.5" fill="#177245" text-anchor="start" font-weight="700">1002 Warehouse</text>
<text x="953.5" y="488.0" font-size="11.5" fill="#354a5f" text-anchor="start" font-weight="400">承担 25% 的电费分摊</text>
<rect x="40.0" y="537.0" width="1200.0" height="134.0" rx="12" fill="#fdf3d7" stroke="#8d6e00" stroke-width="1.2"/>
<text x="58.0" y="565.0" font-size="15.5" fill="#8d6e00" text-anchor="start" font-weight="700">④ 明细与规则层（挂在成本中心/订单上的数值与规则）</text>
<text x="453.3" y="565.0" font-size="12" fill="#6b7a8d" text-anchor="start" font-weight="400">这一层的值是「算出来的」或「定规矩的」</text>
<rect x="58.0" y="583.0" width="280.5" height="76.0" rx="8" fill="#ffffff" stroke="#8d6e00" stroke-width="1.2"/>
<text x="70.0" y="604.0" font-size="13.5" fill="#8d6e00" text-anchor="start" font-weight="700">作业价格 KP26</text>
<text x="70.0" y="621.0" font-size="11.5" fill="#354a5f" text-anchor="start" font-weight="400">计划作业量 19,200 H</text>
<text x="70.0" y="638.0" font-size="11.5" fill="#354a5f" text-anchor="start" font-weight="400">版本 0 / 期间 1–12 / 2021</text>
<rect x="352.5" y="583.0" width="280.5" height="76.0" rx="8" fill="#ffffff" stroke="#8d6e00" stroke-width="1.2"/>
<text x="364.5" y="604.0" font-size="13.5" fill="#8d6e00" text-anchor="start" font-weight="700">统计指标实际值 KB31N</text>
<text x="364.5" y="621.0" font-size="11.5" fill="#354a5f" text-anchor="start" font-weight="400">480 / 520 / 200 / 590</text>
<text x="364.5" y="638.0" font-size="11.5" fill="#354a5f" text-anchor="start" font-weight="400">310 / 400（M2）</text>
<rect x="647.0" y="583.0" width="280.5" height="76.0" rx="8" fill="#ffffff" stroke="#8d6e00" stroke-width="1.2"/>
<text x="659.0" y="604.0" font-size="13.5" fill="#8d6e00" text-anchor="start" font-weight="700">分配循环 DRENT</text>
<text x="659.0" y="621.0" font-size="11.5" fill="#354a5f" text-anchor="start" font-weight="400">发送方 2006 + 55020141</text>
<text x="659.0" y="638.0" font-size="11.5" fill="#354a5f" text-anchor="start" font-weight="400">接收方 HQ，追踪因素 RENT</text>
<rect x="941.5" y="583.0" width="280.5" height="76.0" rx="8" fill="#ffffff" stroke="#8d6e00" stroke-width="1.2"/>
<text x="953.5" y="604.0" font-size="13.5" fill="#8d6e00" text-anchor="start" font-weight="700">分摊循环 AUTILI</text>
<text x="953.5" y="621.0" font-size="11.5" fill="#354a5f" text-anchor="start" font-weight="400">次级要素 802010</text>
<text x="953.5" y="638.0" font-size="11.5" fill="#354a5f" text-anchor="start" font-weight="400">1001 75% / 1002 25%</text>
<rect x="40.0" y="687.0" width="1200.0" height="134.0" rx="12" fill="#efeaf9" stroke="#5b3fa8" stroke-width="1.2"/>
<text x="58.0" y="715.0" font-size="15.5" fill="#5b3fa8" text-anchor="start" font-weight="700">⑤ 内部订单与结算规则（项目型成本对象）</text>
<text x="366.9" y="715.0" font-size="12" fill="#6b7a8d" text-anchor="start" font-weight="400">任务 27–33 的配置成果</text>
<rect x="58.0" y="733.0" width="378.7" height="76.0" rx="8" fill="#ffffff" stroke="#5b3fa8" stroke-width="1.2"/>
<text x="70.0" y="754.0" font-size="13.5" fill="#5b3fa8" text-anchor="start" font-weight="700">订单类型 PMKT</text>
<text x="70.0" y="771.0" font-size="11.5" fill="#354a5f" text-anchor="start" font-weight="400">市场活动；编号范围</text>
<text x="70.0" y="788.0" font-size="11.5" fill="#354a5f" text-anchor="start" font-weight="400">结算参数文件（画面 20）</text>
<rect x="450.7" y="733.0" width="378.7" height="76.0" rx="8" fill="#ffffff" stroke="#5b3fa8" stroke-width="1.2"/>
<text x="462.7" y="754.0" font-size="13.5" fill="#5b3fa8" text-anchor="start" font-weight="700">订单 500000 的结算规则</text>
<text x="462.7" y="771.0" font-size="11.5" fill="#354a5f" text-anchor="start" font-weight="400">8 个成本中心按份额</text>
<text x="462.7" y="788.0" font-size="11.5" fill="#354a5f" text-anchor="start" font-weight="400">合计必须 100%</text>
<rect x="843.3" y="733.0" width="378.7" height="76.0" rx="8" fill="#ffffff" stroke="#5b3fa8" stroke-width="1.2"/>
<text x="855.3" y="754.0" font-size="13.5" fill="#5b3fa8" text-anchor="start" font-weight="700">分配结构 A1</text>
<text x="855.3" y="771.0" font-size="11.5" fill="#354a5f" text-anchor="start" font-weight="400">接收方类型 CTR</text>
<text x="855.3" y="788.0" font-size="11.5" fill="#354a5f" text-anchor="start" font-weight="400">结算成本要素 803010</text>
