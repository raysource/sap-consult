<text x="58.0" y="494.0" font-size="12" fill="#354a5f" text-anchor="start" font-weight="400">输入：所有模块的业务凭证（MM 收货、SD 开票、CO 结算）；输出：总账、应收应付、资产负债表与损益表。</text>
