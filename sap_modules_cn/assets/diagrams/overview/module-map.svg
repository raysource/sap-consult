<text x="58.0" y="638.0" font-size="12" fill="#354a5f" text-anchor="start" font-weight="400">输入：FI 的费用、MM 的领料与价差、PP 的订单工时与入库；输出：成本中心报表、订单成本、产品成本与差异分析。</text>
