<text x="58.0" y="206.0" font-size="12" fill="#354a5f" text-anchor="start" font-weight="400">输入：需求（部门/MRP/SD）与主数据（物料/供应商/信息记录）；输出：采购订单、物料凭证、发票凭证，以及自动生成的会计凭证。</text>
