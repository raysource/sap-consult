<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 348" width="1280" height="348" role="img" aria-label="MRP 一跑，系统到底做了什么" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif">
<title>MRP 一跑，系统到底做了什么</title>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0a6ed1"/></marker><marker id="ar2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#007272"/></marker><marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ffffff"/></marker><marker id="arback" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M10,0 L0,5 L10,10 z" fill="#b3261e"/></marker></defs>
<rect width="1280" height="348" fill="#ffffff"/>
<text x="40.0" y="46.0" font-size="22" fill="#1d2d3e" text-anchor="start" font-weight="700">MRP 一跑，系统到底做了什么</text>
<text x="40.0" y="72.0" font-size="12.5" fill="#6b7a8d" text-anchor="start" font-weight="400">输入全部来自主数据；输出是计划订单（自制件）与采购申请（外购件）</text>
<rect x="40.0" y="104.0" width="150.0" height="51.0" rx="9" fill="#e3f0fa" stroke="#0a6ed1" stroke-width="1.5"/>
<circle cx="58.0" cy="122.0" r="12" fill="#0a6ed1"/><text x="58.0" y="126.3" font-size="11.5" fill="#ffffff" text-anchor="middle" font-weight="700">1</text>
<text x="76.0" y="127.0" font-size="14" fill="#0a6ed1" text-anchor="start" font-weight="700">毛需求</text>
<text x="52.0" y="146.0" font-size="11.5" fill="#354a5f" text-anchor="start" font-weight="400">独立需求 PIR +</text>
<text x="52.0" y="163.0" font-size="11.5" fill="#354a5f" text-anchor="start" font-weight="400">销售订单需求</text>
<path d="M 192 130 H 216" fill="none" stroke="#0a6ed1" stroke-width="1.8" marker-end="url(#ar)"/>
<rect x="220.0" y="104.0" width="153.0" height="51.0" rx="9" fill="#e6f2f2" stroke="#007272" stroke-width="1.5"/>
<circle cx="238.0" cy="122.0" r="12" fill="#007272"/><text x="238.0" y="126.3" font-size="11.5" fill="#ffffff" text-anchor="middle" font-weight="700">2</text>
<text x="256.0" y="127.0" font-size="14" fill="#007272" text-anchor="start" font-weight="700">可用库存与供给</text>
<text x="232.0" y="146.0" font-size="11.5" fill="#354a5f" text-anchor="start" font-weight="400">库存 + 已确认收货 +</text>
<text x="232.0" y="163.0" font-size="11.5" fill="#354a5f" text-anchor="start" font-weight="400">已有计划要素</text>
<path d="M 375 130 H 399" fill="none" stroke="#007272" stroke-width="1.8" marker-end="url(#ar)"/>
<rect x="403.0" y="104.0" width="150.0" height="51.0" rx="9" fill="#e6f2f2" stroke="#007272" stroke-width="1.5"/>
<circle cx="421.0" cy="122.0" r="12" fill="#007272"/><text x="421.0" y="126.3" font-size="11.5" fill="#ffffff" text-anchor="middle" font-weight="700">3</text>
<text x="439.0" y="127.0" font-size="14" fill="#007272" text-anchor="start" font-weight="700">净需求</text>
<text x="415.0" y="146.0" font-size="11.5" fill="#354a5f" text-anchor="start" font-weight="400">毛需求 − 可用库存 +</text>
<text x="415.0" y="163.0" font-size="11.5" fill="#354a5f" text-anchor="start" font-weight="400">安全库存</text>
<path d="M 555 130 H 579" fill="none" stroke="#007272" stroke-width="1.8" marker-end="url(#ar)"/>
<rect x="583.0" y="104.0" width="150.0" height="51.0" rx="9" fill="#fdf3d7" stroke="#8d6e00" stroke-width="1.5"/>
<circle cx="601.0" cy="122.0" r="12" fill="#8d6e00"/><text x="601.0" y="126.3" font-size="11.5" fill="#ffffff" text-anchor="middle" font-weight="700">4</text>
<text x="619.0" y="127.0" font-size="14" fill="#8d6e00" text-anchor="start" font-weight="700">提前期回排</text>
<text x="595.0" y="146.0" font-size="11.5" fill="#354a5f" text-anchor="start" font-weight="400">按主数据的提前期算开</text>
<text x="595.0" y="163.0" font-size="11.5" fill="#354a5f" text-anchor="start" font-weight="400">工日期</text>
<path d="M 735 130 H 759" fill="none" stroke="#8d6e00" stroke-width="1.8" marker-end="url(#ar)"/>
<rect x="763.0" y="104.0" width="150.0" height="51.0" rx="9" fill="#fdf3d7" stroke="#8d6e00" stroke-width="1.5"/>
<circle cx="781.0" cy="122.0" r="12" fill="#8d6e00"/><text x="781.0" y="126.3" font-size="11.5" fill="#ffffff" text-anchor="middle" font-weight="700">5</text>
<text x="799.0" y="127.0" font-size="14" fill="#8d6e00" text-anchor="start" font-weight="700">BOM 逐层展开</text>
<text x="775.0" y="146.0" font-size="11.5" fill="#354a5f" text-anchor="start" font-weight="400">组件变成非独立需求</text>
<text x="775.0" y="163.0" font-size="11.5" fill="#354a5f" text-anchor="start" font-weight="400">DepReq</text>
<path d="M 915 130 H 939" fill="none" stroke="#8d6e00" stroke-width="1.8" marker-end="url(#ar)"/>
<rect x="943.0" y="104.0" width="150.0" height="51.0" rx="9" fill="#e6f2ec" stroke="#177245" stroke-width="1.5"/>
<circle cx="961.0" cy="122.0" r="12" fill="#177245"/><text x="961.0" y="126.3" font-size="11.5" fill="#ffffff" text-anchor="middle" font-weight="700">6</text>
<text x="979.0" y="127.0" font-size="14" fill="#177245" text-anchor="start" font-weight="700">生成计划要素</text>
<text x="955.0" y="146.0" font-size="11.5" fill="#354a5f" text-anchor="start" font-weight="400">自制件出计划订单，外</text>
<text x="955.0" y="163.0" font-size="11.5" fill="#354a5f" text-anchor="start" font-weight="400">购件出采购申请</text>
<path d="M 1095 130 h 14 V 164 H 20 V 226 h -14" fill="none" stroke="#177245" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ar)"/>
<rect x="40.0" y="200.0" width="153.0" height="51.0" rx="9" fill="#efeaf9" stroke="#5b3fa8" stroke-width="1.5"/>
<circle cx="58.0" cy="218.0" r="12" fill="#5b3fa8"/><text x="58.0" y="222.3" font-size="11.5" fill="#ffffff" text-anchor="middle" font-weight="700">7</text>
<text x="76.0" y="223.0" font-size="14" fill="#5b3fa8" text-anchor="start" font-weight="700">日期调整与例外</text>
<text x="52.0" y="242.0" font-size="11.5" fill="#354a5f" text-anchor="start" font-weight="400">过去日期改到可行时间，</text>
<text x="52.0" y="259.0" font-size="11.5" fill="#354a5f" text-anchor="start" font-weight="400">发例外消息</text>
<rect x="40.0" y="300.0" width="1200.0" height="34.5" rx="8" fill="#e3f0fa" stroke="#0a6ed1" stroke-width="1.2"/>
<text x="52.0" y="322.0" font-size="12.5" fill="#0854a0" text-anchor="start" font-weight="400">MRP 不是黑盒：它的输入就是主数据里的那几个字段（MRP 类型、批量、安全库存、计划边际码、BOM、工艺路线、提前期），输出就是计划订单与采购申请。跑不出结果，先查主数据缺了哪一项。</text>
</svg>
