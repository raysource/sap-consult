<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 862" width="1280" height="862" role="img" aria-label="PP 主数据的五个层次" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif">
<title>PP 主数据的五个层次</title>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0a6ed1"/></marker><marker id="ar2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#007272"/></marker><marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ffffff"/></marker><marker id="arback" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M10,0 L0,5 L10,10 z" fill="#b3261e"/></marker></defs>
<rect width="1280" height="862" fill="#ffffff"/>
<text x="40.0" y="46.0" font-size="22" fill="#1d2d3e" text-anchor="start" font-weight="700">PP 主数据的五个层次</text>
<text x="40.0" y="72.0" font-size="12.5" fill="#6b7a8d" text-anchor="start" font-weight="400">从一般数据到成本核算配置：哪一层缺字段，MRP 或成本核算就会卡住</text>
<rect x="40.0" y="104.0" width="1200.0" height="134.0" rx="12" fill="#e3f0fa" stroke="#0a6ed1" stroke-width="1.2"/>
<text x="58.0" y="132.0" font-size="15.5" fill="#0a6ed1" text-anchor="start" font-weight="700">① 一般层（跨工厂）· 表 MARA</text>
<text x="286.9" y="132.0" font-size="12" fill="#6b7a8d" text-anchor="start" font-weight="400">决定可选视图与编号范围</text>
<rect x="58.0" y="150.0" width="280.5" height="76.0" rx="8" fill="#ffffff" stroke="#0a6ed1" stroke-width="1.2"/>
<text x="70.0" y="171.0" font-size="13.5" fill="#0a6ed1" text-anchor="start" font-weight="700">物料基本数据</text>
<text x="70.0" y="188.0" font-size="11.5" fill="#354a5f" text-anchor="start" font-weight="400">物料类型 FERT / ROH / HAWA</text>
<text x="70.0" y="205.0" font-size="11.5" fill="#354a5f" text-anchor="start" font-weight="400">基本单位、物料组</text>
<rect x="352.5" y="150.0" width="280.5" height="76.0" rx="8" fill="#ffffff" stroke="#0a6ed1" stroke-width="1.2"/>
<text x="364.5" y="171.0" font-size="13.5" fill="#0a6ed1" text-anchor="start" font-weight="700">物料描述</text>
<text x="364.5" y="188.0" font-size="11.5" fill="#354a5f" text-anchor="start" font-weight="400">描述、重量体积、行业部门</text>
<rect x="647.0" y="150.0" width="280.5" height="76.0" rx="8" fill="#ffffff" stroke="#0a6ed1" stroke-width="1.2"/>
<text x="659.0" y="171.0" font-size="13.5" fill="#0a6ed1" text-anchor="start" font-weight="700">编号范围</text>
<text x="659.0" y="188.0" font-size="11.5" fill="#354a5f" text-anchor="start" font-weight="400">内部/外部给号由物料类型决定</text>
<rect x="941.5" y="150.0" width="280.5" height="76.0" rx="8" fill="#ffffff" stroke="#0a6ed1" stroke-width="1.2"/>
<text x="953.5" y="171.0" font-size="13.5" fill="#0a6ed1" text-anchor="start" font-weight="700">跨工厂状态</text>
<text x="953.5" y="188.0" font-size="11.5" fill="#354a5f" text-anchor="start" font-weight="400">工厂级状态与删除标识的默认值</text>
<rect x="40.0" y="254.0" width="1200.0" height="134.0" rx="12" fill="#e6f2f2" stroke="#007272" stroke-width="1.2"/>
<text x="58.0" y="282.0" font-size="15.5" fill="#007272" text-anchor="start" font-weight="700">② 工厂层（MRP 与生产计划）· 表 MARC</text>
<text x="354.6" y="282.0" font-size="12" fill="#6b7a8d" text-anchor="start" font-weight="400">MRP 的输入全在这一层</text>
