<text x="70.0" y="621.0" font-size="13.5" fill="#8d6e00" text-anchor="start" font-weight="700">生产计划参数文件 000001</text>
<text x="70.0" y="638.0" font-size="11.5" fill="#354a5f" text-anchor="start" font-weight="400">排程行为；分配给物料时优先</text>
<rect x="352.5" y="600.0" width="280.5" height="76.0" rx="8" fill="#ffffff" stroke="#8d6e00" stroke-width="1.2"/>
<text x="364.5" y="621.0" font-size="13.5" fill="#8d6e00" text-anchor="start" font-weight="700">生产调度员 999</text>
<text x="364.5" y="638.0" font-size="11.5" fill="#354a5f" text-anchor="start" font-weight="400">责任归属与筛选键</text>
<rect x="647.0" y="600.0" width="280.5" height="76.0" rx="8" fill="#ffffff" stroke="#8d6e00" stroke-width="1.2"/>
<text x="659.0" y="621.0" font-size="13.5" fill="#8d6e00" text-anchor="start" font-weight="700">控制码 ZKM1</text>
<text x="659.0" y="638.0" font-size="11.5" fill="#354a5f" text-anchor="start" font-weight="400">决定排程、能力需求、成本与确认</text>
<rect x="941.5" y="600.0" width="280.5" height="76.0" rx="8" fill="#ffffff" stroke="#8d6e00" stroke-width="1.2"/>
<text x="953.5" y="621.0" font-size="13.5" fill="#8d6e00" text-anchor="start" font-weight="700">可用性检查</text>
<text x="953.5" y="638.0" font-size="11.5" fill="#354a5f" text-anchor="start" font-weight="400">检查组 02 + 检查规则 PP</text>
<text x="953.5" y="655.0" font-size="11.5" fill="#354a5f" text-anchor="start" font-weight="400">检查控制 PP01 / PP02</text>
<rect x="40.0" y="704.0" width="1200.0" height="134.0" rx="12" fill="#efeaf9" stroke="#5b3fa8" stroke-width="1.2"/>
<text x="58.0" y="732.0" font-size="15.5" fill="#5b3fa8" text-anchor="start" font-weight="700">⑤ 成本核算配置层（任务 17–21）</text>
<text x="307.9" y="732.0" font-size="12" fill="#6b7a8d" text-anchor="start" font-weight="400">标准成本的三块拼图</text>
<rect x="58.0" y="750.0" width="280.5" height="76.0" rx="8" fill="#ffffff" stroke="#5b3fa8" stroke-width="1.2"/>
<text x="70.0" y="771.0" font-size="13.5" fill="#5b3fa8" text-anchor="start" font-weight="700">成本构成结构 Z1</text>
<text x="70.0" y="788.0" font-size="11.5" fill="#354a5f" text-anchor="start" font-weight="400">成本组件与成本要素区间</text>
<text x="70.0" y="805.0" font-size="11.5" fill="#354a5f" text-anchor="start" font-weight="400">分配给公司代码、工厂与变式</text>
<rect x="352.5" y="750.0" width="280.5" height="76.0" rx="8" fill="#ffffff" stroke="#5b3fa8" stroke-width="1.2"/>
<text x="364.5" y="771.0" font-size="13.5" fill="#5b3fa8" text-anchor="start" font-weight="700">估价变式 001 / 007</text>
<text x="364.5" y="788.0" font-size="11.5" fill="#354a5f" text-anchor="start" font-weight="400">001 物料计划；007 订单实际成本</text>
<rect x="647.0" y="750.0" width="280.5" height="76.0" rx="8" fill="#ffffff" stroke="#5b3fa8" stroke-width="1.2"/>
