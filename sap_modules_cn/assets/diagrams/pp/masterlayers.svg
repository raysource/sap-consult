<text x="364.5" y="471.0" font-size="13.5" fill="#177245" text-anchor="start" font-weight="700">工艺路线（CA01）</text>
<text x="364.5" y="488.0" font-size="11.5" fill="#354a5f" text-anchor="start" font-weight="400">工序 × 工作中心 × 控制码 ZKM1</text>
<text x="364.5" y="505.0" font-size="11.5" fill="#354a5f" text-anchor="start" font-weight="400">组 + 组计数器</text>
<rect x="647.0" y="450.0" width="280.5" height="76.0" rx="8" fill="#ffffff" stroke="#177245" stroke-width="1.2"/>
<text x="659.0" y="471.0" font-size="13.5" fill="#177245" text-anchor="start" font-weight="700">工作中心（CR01）</text>
<text x="659.0" y="488.0" font-size="11.5" fill="#354a5f" text-anchor="start" font-weight="400">9991–9996，链接成本中心 1001</text>
<rect x="941.5" y="450.0" width="280.5" height="76.0" rx="8" fill="#ffffff" stroke="#177245" stroke-width="1.2"/>
<text x="953.5" y="471.0" font-size="13.5" fill="#177245" text-anchor="start" font-weight="700">能力（CR11）</text>
<text x="953.5" y="488.0" font-size="11.5" fill="#354a5f" text-anchor="start" font-weight="400">LABOR 人工工时 + 机器工时</text>
<text x="953.5" y="505.0" font-size="11.5" fill="#354a5f" text-anchor="start" font-weight="400">能力类别 002 工时</text>
<rect x="40.0" y="554.0" width="1200.0" height="134.0" rx="12" fill="#fdf3d7" stroke="#8d6e00" stroke-width="1.2"/>
<text x="58.0" y="582.0" font-size="15.5" fill="#8d6e00" text-anchor="start" font-weight="700">④ 参数与检查层（任务 01–13、29–31）</text>
<text x="352.5" y="582.0" font-size="12" fill="#6b7a8d" text-anchor="start" font-weight="400">缺一个都会在很后面才报错</text>
