<text x="70.0" y="471.0" font-size="13.5" fill="#177245" text-anchor="start" font-weight="700">BOM（CS01）</text>
<text x="70.0" y="488.0" font-size="11.5" fill="#354a5f" text-anchor="start" font-weight="400">组件 + 数量 + 项目类别 L</text>
