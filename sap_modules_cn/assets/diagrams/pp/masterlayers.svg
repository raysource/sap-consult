<rect x="647.0" y="300.0" width="280.5" height="76.0" rx="8" fill="#ffffff" stroke="#007272" stroke-width="1.2"/>
<text x="659.0" y="321.0" font-size="13.5" fill="#007272" text-anchor="start" font-weight="700">生产计划 / 工作排程</text>
<text x="659.0" y="338.0" font-size="11.5" fill="#354a5f" text-anchor="start" font-weight="400">生产计划参数文件 000001（任务 16）</text>
<text x="659.0" y="355.0" font-size="11.5" fill="#354a5f" text-anchor="start" font-weight="400">生产调度员 999</text>
<rect x="941.5" y="300.0" width="280.5" height="76.0" rx="8" fill="#ffffff" stroke="#007272" stroke-width="1.2"/>
<text x="953.5" y="321.0" font-size="13.5" fill="#007272" text-anchor="start" font-weight="700">会计 1 / 成本 1</text>
<text x="953.5" y="338.0" font-size="11.5" fill="#354a5f" text-anchor="start" font-weight="400">评估类 7920、价格控制 S</text>
<text x="953.5" y="355.0" font-size="11.5" fill="#354a5f" text-anchor="start" font-weight="400">成本核算批量 10 PC</text>
