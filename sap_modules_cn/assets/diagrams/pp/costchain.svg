<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 760" width="1280" height="760" role="img" aria-label="产品成本的三段：事前估算 · 事中归集 · 事后结算" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif">
<title>产品成本的三段：事前估算 · 事中归集 · 事后结算</title>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0a6ed1"/></marker><marker id="ar2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#007272"/></marker><marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ffffff"/></marker><marker id="arback" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M10,0 L0,5 L10,10 z" fill="#b3261e"/></marker></defs>
<rect width="1280" height="760" fill="#ffffff"/>
<text x="40.0" y="46.0" font-size="22" fill="#1d2d3e" text-anchor="start" font-weight="700">产品成本的三段：事前估算 · 事中归集 · 事后结算</text>
<text x="40.0" y="72.0" font-size="12.5" fill="#6b7a8d" text-anchor="start" font-weight="400">PP 与 CO 的全部交集都在这三段里；每一段都能落到教材的具体任务与画面</text>
<rect x="40.0" y="106.0" width="1200.0" height="146.0" rx="9" fill="#e3f0fa" stroke="#0a6ed1" stroke-width="1.4"/>
<rect x="40.0" y="106.0" width="4.5" height="146.0" rx="2" fill="#0a6ed1" stroke="#0a6ed1" stroke-width="1.4"/>
<text x="58.0" y="134.0" font-size="15.5" fill="#0a6ed1" text-anchor="start" font-weight="700">事前：CK11N 算 → CK24 标记 → CK24 发布</text>
<rect x="58.0" y="158.0" width="105.5" height="34.0" rx="8" fill="#ffffff" stroke="#0a6ed1" stroke-width="1.2"/>
<text x="69.0" y="173.5" font-size="11.5" fill="#354a5f" text-anchor="start" font-weight="400">BOM + 工艺路线</text>
<path d="M 165 169 h 12" fill="none" stroke="#0a6ed1" stroke-width="1.3" marker-end="url(#ar)"/>
<rect x="179.5" y="158.0" width="104.7" height="34.0" rx="8" fill="#ffffff" stroke="#0a6ed1" stroke-width="1.2"/>
<text x="190.5" y="173.5" font-size="11.5" fill="#354a5f" text-anchor="start" font-weight="400">CK11N 成本估算</text>
<path d="M 285 169 h 12" fill="none" stroke="#0a6ed1" stroke-width="1.3" marker-end="url(#ar)"/>
<rect x="300.3" y="158.0" width="109.6" height="34.0" rx="8" fill="#ffffff" stroke="#0a6ed1" stroke-width="1.2"/>
<text x="311.3" y="173.5" font-size="11.5" fill="#354a5f" text-anchor="start" font-weight="400">CK24 标记未来价</text>
<path d="M 411 169 h 12" fill="none" stroke="#0a6ed1" stroke-width="1.3" marker-end="url(#ar)"/>
<rect x="425.9" y="158.0" width="109.6" height="34.0" rx="8" fill="#ffffff" stroke="#0a6ed1" stroke-width="1.2"/>
<text x="436.9" y="173.5" font-size="11.5" fill="#354a5f" text-anchor="start" font-weight="400">CK24 发布标准价</text>
<path d="M 537 169 h 12" fill="none" stroke="#0a6ed1" stroke-width="1.3" marker-end="url(#ar)"/>
<text x="58.0" y="206.0" font-size="12" fill="#354a5f" text-anchor="start" font-weight="400">教材：批量 10 PC，货物制造成本 25,386.58 元，折算单位成本 2,538.66 元。</text>
<text x="58.0" y="224.0" font-size="12" fill="#354a5f" text-anchor="start" font-weight="400">标准价写进物料（评估类 7920、价格控制 S）；有库存时发布还会生成会计凭证。</text>
<rect x="40.0" y="268.0" width="1200.0" height="146.0" rx="9" fill="#e6f2f2" stroke="#007272" stroke-width="1.4"/>
<rect x="40.0" y="268.0" width="4.5" height="146.0" rx="2" fill="#007272" stroke="#007272" stroke-width="1.4"/>
<text x="58.0" y="296.0" font-size="15.5" fill="#007272" text-anchor="start" font-weight="700">事中：材料与工时压在借方，产出记在贷方</text>
<rect x="58.0" y="320.0" width="121.7" height="34.0" rx="8" fill="#ffffff" stroke="#007272" stroke-width="1.2"/>
<text x="69.0" y="335.5" font-size="11.5" fill="#354a5f" text-anchor="start" font-weight="400">发料 261（MB1A）</text>
<path d="M 181 331 h 12" fill="none" stroke="#007272" stroke-width="1.3" marker-end="url(#ar)"/>
<rect x="195.7" y="320.0" width="150.7" height="34.0" rx="8" fill="#ffffff" stroke="#007272" stroke-width="1.2"/>
<text x="206.7" y="335.5" font-size="11.5" fill="#354a5f" text-anchor="start" font-weight="400">确认 CO11N（作业成本）</text>
<path d="M 347 331 h 12" fill="none" stroke="#007272" stroke-width="1.3" marker-end="url(#ar)"/>
<rect x="362.4" y="320.0" width="137.5" height="34.0" rx="8" fill="#ffffff" stroke="#007272" stroke-width="1.2"/>
<text x="373.4" y="335.5" font-size="11.5" fill="#354a5f" text-anchor="start" font-weight="400">收货 101（按标准价）</text>
<path d="M 501 331 h 12" fill="none" stroke="#007272" stroke-width="1.3" marker-end="url(#ar)"/>
<rect x="516.0" y="320.0" width="68.0" height="34.0" rx="8" fill="#ffffff" stroke="#007272" stroke-width="1.2"/>
<text x="527.0" y="335.5" font-size="11.5" fill="#354a5f" text-anchor="start" font-weight="400">订单余额</text>
<path d="M 585 331 h 12" fill="none" stroke="#007272" stroke-width="1.3" marker-end="url(#ar)"/>
<text x="58.0" y="368.0" font-size="12" fill="#354a5f" text-anchor="start" font-weight="400">发料与报工是订单的借方（实际成本），产成品收货是贷方（产出）。</text>
<text x="58.0" y="386.0" font-size="12" fill="#354a5f" text-anchor="start" font-weight="400">报工的成本 = 实际工时 × 工作中心作业价格（KP26）；教材此步未完成 KP26。</text>
<rect x="40.0" y="430.0" width="1200.0" height="146.0" rx="9" fill="#fdf3d7" stroke="#8d6e00" stroke-width="1.4"/>
<rect x="40.0" y="430.0" width="4.5" height="146.0" rx="2" fill="#8d6e00" stroke="#8d6e00" stroke-width="1.4"/>
<text x="58.0" y="458.0" font-size="15.5" fill="#8d6e00" text-anchor="start" font-weight="700">事后：看余额、算差异、结算</text>
<rect x="58.0" y="482.0" width="109.6" height="34.0" rx="8" fill="#ffffff" stroke="#8d6e00" stroke-width="1.2"/>
<text x="69.0" y="497.5" font-size="11.5" fill="#354a5f" text-anchor="start" font-weight="400">CO03 看订单成本</text>
<path d="M 169 493 h 12" fill="none" stroke="#8d6e00" stroke-width="1.3" marker-end="url(#ar)"/>
<rect x="183.6" y="482.0" width="109.6" height="34.0" rx="8" fill="#ffffff" stroke="#8d6e00" stroke-width="1.2"/>
<text x="194.6" y="497.5" font-size="11.5" fill="#354a5f" text-anchor="start" font-weight="400">CO02 技术性完成</text>
<path d="M 294 493 h 12" fill="none" stroke="#8d6e00" stroke-width="1.3" marker-end="url(#ar)"/>
<rect x="309.3" y="482.0" width="75.1" height="34.0" rx="8" fill="#ffffff" stroke="#8d6e00" stroke-width="1.2"/>
<text x="320.3" y="497.5" font-size="11.5" fill="#354a5f" text-anchor="start" font-weight="400">KO88 结算</text>
<path d="M 385 493 h 12" fill="none" stroke="#8d6e00" stroke-width="1.3" marker-end="url(#ar)"/>
<rect x="400.4" y="482.0" width="101.6" height="34.0" rx="8" fill="#ffffff" stroke="#8d6e00" stroke-width="1.2"/>
<text x="411.4" y="497.5" font-size="11.5" fill="#354a5f" text-anchor="start" font-weight="400">KKBC_ORD 报表</text>
<path d="M 503 493 h 12" fill="none" stroke="#8d6e00" stroke-width="1.3" marker-end="url(#ar)"/>
<text x="58.0" y="530.0" font-size="12" fill="#354a5f" text-anchor="start" font-weight="400">借方 &gt; 贷方就是差异：教材任务 46 看到余额，任务 48 做结算（画面提示需要维护发送者的结算规则）。</text>
<text x="58.0" y="548.0" font-size="12" fill="#354a5f" text-anchor="start" font-weight="400">月末未完工订单的实际成本余额转在制品（任务 27/28 的估价变式与结果分析版本）。</text>
<rect x="40.0" y="592.0" width="1200.0" height="146.0" rx="9" fill="#fdeae9" stroke="#b3261e" stroke-width="1.4"/>
<rect x="40.0" y="592.0" width="4.5" height="146.0" rx="2" fill="#b3261e" stroke="#b3261e" stroke-width="1.4"/>
<text x="58.0" y="620.0" font-size="15.5" fill="#b3261e" text-anchor="start" font-weight="700">差异去哪：材料价差与生产差异分开看</text>
<rect x="58.0" y="644.0" width="91.5" height="34.0" rx="8" fill="#ffffff" stroke="#b3261e" stroke-width="1.2"/>
<text x="69.0" y="659.5" font-size="11.5" fill="#354a5f" text-anchor="start" font-weight="400">采购价差 PRD</text>
<path d="M 151 655 h 12" fill="none" stroke="#b3261e" stroke-width="1.3" marker-end="url(#ar)"/>
<rect x="165.5" y="644.0" width="111.6" height="34.0" rx="8" fill="#ffffff" stroke="#b3261e" stroke-width="1.2"/>
<text x="176.5" y="659.5" font-size="11.5" fill="#354a5f" text-anchor="start" font-weight="400">生产订单差异 DIF</text>
<path d="M 278 655 h 12" fill="none" stroke="#b3261e" stroke-width="1.3" marker-end="url(#ar)"/>
<rect x="293.1" y="644.0" width="68.0" height="34.0" rx="8" fill="#ffffff" stroke="#b3261e" stroke-width="1.2"/>
<text x="304.1" y="659.5" font-size="11.5" fill="#354a5f" text-anchor="start" font-weight="400">差异科目</text>
<path d="M 362 655 h 12" fill="none" stroke="#b3261e" stroke-width="1.3" marker-end="url(#ar)"/>
<rect x="377.1" y="644.0" width="68.0" height="34.0" rx="8" fill="#ffffff" stroke="#b3261e" stroke-width="1.2"/>
<text x="388.1" y="659.5" font-size="11.5" fill="#354a5f" text-anchor="start" font-weight="400">成本报表</text>
<path d="M 446 655 h 12" fill="none" stroke="#b3261e" stroke-width="1.3" marker-end="url(#ar)"/>
<text x="58.0" y="692.0" font-size="12" fill="#354a5f" text-anchor="start" font-weight="400">标准价物料的采购价差进 PRD 科目（MM 教材任务 28 的 OBYC 配置）。</text>
<text x="58.0" y="710.0" font-size="12" fill="#354a5f" text-anchor="start" font-weight="400">生产订单差异经 KO88 结到差异科目或成本对象；两者不要混为一谈。</text>
</svg>
