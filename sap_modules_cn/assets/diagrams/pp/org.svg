<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 588" width="1280" height="588" role="img" aria-label="PP 组织结构与资源" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif">
<title>PP 组织结构与资源</title>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0a6ed1"/></marker><marker id="ar2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#007272"/></marker><marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ffffff"/></marker><marker id="arback" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M10,0 L0,5 L10,10 z" fill="#b3261e"/></marker></defs>
<rect width="1280" height="588" fill="#ffffff"/>
<text x="40.0" y="46.0" font-size="22" fill="#1d2d3e" text-anchor="start" font-weight="700">PP 组织结构与资源</text>
<text x="40.0" y="72.0" font-size="12.5" fill="#6b7a8d" text-anchor="start" font-weight="400">教材场景：公司代码 C999 / 工厂 P999 / 成本控制范围 C999 / 调度员 999 / 工作中心 9991–9996</text>
<rect x="515.0" y="108.0" width="250.0" height="56.0" rx="9" fill="#e3f0fa" stroke="#0a6ed1" stroke-width="1.4"/>
<text x="526.0" y="129.0" font-size="13.5" fill="#0a6ed1" text-anchor="start" font-weight="700">公司代码 C999（颐宁公司）</text>
<text x="526.0" y="146.0" font-size="11.5" fill="#354a5f" text-anchor="start" font-weight="400">对外报表的最小法人单位（FI 侧建）</text>
<rect x="40.0" y="226.0" width="250.0" height="56.0" rx="9" fill="#e6f2f2" stroke="#007272" stroke-width="1.4"/>
<text x="51.0" y="247.0" font-size="13.5" fill="#007272" text-anchor="start" font-weight="700">工厂 P999（颐宁机械工厂）</text>
<text x="51.0" y="264.0" font-size="11.5" fill="#354a5f" text-anchor="start" font-weight="400">生产与库存场所；在 MM 中同时是评估范围</text>
<rect x="515.0" y="226.0" width="250.0" height="72.0" rx="9" fill="#e6f2f2" stroke="#007272" stroke-width="1.4"/>
<text x="526.0" y="247.0" font-size="13.5" fill="#007272" text-anchor="start" font-weight="700">成本控制范围 C999</text>
<text x="526.0" y="264.0" font-size="11.5" fill="#354a5f" text-anchor="start" font-weight="400">作业类型、成本中心、订单结算都挂在它下</text>
<text x="526.0" y="280.0" font-size="11.5" fill="#354a5f" text-anchor="start" font-weight="400">面</text>
<rect x="990.0" y="226.0" width="250.0" height="56.0" rx="9" fill="#e6f2f2" stroke="#007272" stroke-width="1.4"/>
<text x="1001.0" y="247.0" font-size="13.5" fill="#007272" text-anchor="start" font-weight="700">生产计划参数文件 000001</text>
<text x="1001.0" y="264.0" font-size="11.5" fill="#354a5f" text-anchor="start" font-weight="400">排程行为的打包参数（任务 01 复制 1000）</text>
<rect x="40.0" y="344.0" width="250.0" height="56.0" rx="9" fill="#efeaf9" stroke="#5b3fa8" stroke-width="1.4"/>
<text x="51.0" y="365.0" font-size="13.5" fill="#5b3fa8" text-anchor="start" font-weight="700">生产调度员 999 颐宁</text>
<text x="51.0" y="382.0" font-size="11.5" fill="#354a5f" text-anchor="start" font-weight="400">在生产作业控制中定义责任归属</text>
<rect x="356.7" y="344.0" width="250.0" height="56.0" rx="9" fill="#e6f2ec" stroke="#177245" stroke-width="1.4"/>
<text x="367.7" y="365.0" font-size="13.5" fill="#177245" text-anchor="start" font-weight="700">工作中心 9991–9996</text>
<text x="367.7" y="382.0" font-size="11.5" fill="#354a5f" text-anchor="start" font-weight="400">执行工序的资源，链接成本中心 1001</text>
<rect x="673.3" y="344.0" width="250.0" height="56.0" rx="9" fill="#e6f2ec" stroke="#177245" stroke-width="1.4"/>
<text x="684.3" y="365.0" font-size="13.5" fill="#177245" text-anchor="start" font-weight="700">能力（人工工时 / 机器工时）</text>
<text x="684.3" y="382.0" font-size="11.5" fill="#354a5f" text-anchor="start" font-weight="400">工厂层共享，再分配给各工作中心</text>
<rect x="990.0" y="344.0" width="250.0" height="56.0" rx="9" fill="#fdf3d7" stroke="#8d6e00" stroke-width="1.4"/>
<text x="1001.0" y="365.0" font-size="13.5" fill="#8d6e00" text-anchor="start" font-weight="700">控制码 ZKM1</text>
<text x="1001.0" y="382.0" font-size="11.5" fill="#354a5f" text-anchor="start" font-weight="400">决定工序排程、能力需求与成本</text>
<rect x="40.0" y="462.0" width="186.7" height="56.0" rx="9" fill="#e6f2ec" stroke="#177245" stroke-width="1.4"/>
<text x="51.0" y="483.0" font-size="13.5" fill="#177245" text-anchor="start" font-weight="700">物料准备 9991</text>
<text x="51.0" y="500.0" font-size="11.5" fill="#354a5f" text-anchor="start" font-weight="400">人工工时</text>
<rect x="242.7" y="462.0" width="186.7" height="56.0" rx="9" fill="#e6f2ec" stroke="#177245" stroke-width="1.4"/>
<text x="253.7" y="483.0" font-size="13.5" fill="#177245" text-anchor="start" font-weight="700">切割 9992</text>
<text x="253.7" y="500.0" font-size="11.5" fill="#354a5f" text-anchor="start" font-weight="400">人工工时</text>
<rect x="445.3" y="462.0" width="186.7" height="56.0" rx="9" fill="#e6f2ec" stroke="#177245" stroke-width="1.4"/>
<text x="456.3" y="483.0" font-size="13.5" fill="#177245" text-anchor="start" font-weight="700">油漆 9993</text>
<text x="456.3" y="500.0" font-size="11.5" fill="#354a5f" text-anchor="start" font-weight="400">机器工时（并行工序）</text>
<rect x="648.0" y="462.0" width="186.7" height="56.0" rx="9" fill="#e6f2ec" stroke="#177245" stroke-width="1.4"/>
<text x="659.0" y="483.0" font-size="13.5" fill="#177245" text-anchor="start" font-weight="700">预装配 9994</text>
<text x="659.0" y="500.0" font-size="11.5" fill="#354a5f" text-anchor="start" font-weight="400">机器工时</text>
<rect x="850.7" y="462.0" width="186.7" height="56.0" rx="9" fill="#e6f2ec" stroke="#177245" stroke-width="1.4"/>
<text x="861.7" y="483.0" font-size="13.5" fill="#177245" text-anchor="start" font-weight="700">装配 9995</text>
<text x="861.7" y="500.0" font-size="11.5" fill="#354a5f" text-anchor="start" font-weight="400">人工工时</text>
<rect x="1053.3" y="462.0" width="186.7" height="56.0" rx="9" fill="#e6f2ec" stroke="#177245" stroke-width="1.4"/>
<text x="1064.3" y="483.0" font-size="13.5" fill="#177245" text-anchor="start" font-weight="700">校验交付 9996</text>
<text x="1064.3" y="500.0" font-size="11.5" fill="#354a5f" text-anchor="start" font-weight="400">人工工时</text>
